<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="BeHoop — suis tes clubs de basket, résultats, vidéos de match et plus." />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&family=Sora:wght@300;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
  <title>BeHoop</title>
</head>
<body>
  <!-- Écran d'ouverture : affiché tout de suite, retiré par lib/splash.ts quand l'appli et ses données sont prêtes, à la fin d'un tour d'animation (même animation que <Loader full />, voir ui/HoopLoader.tsx, CenterSvg) -->
  <!-- Appli installée (iPhone) : au démarrage, iOS recalcule la hauteur de la page (zones sûres) et un centrage à 50 %
       se déplace. On centre donc sur la hauteur réelle de l'écran, qui ne change pas (même valeur pour <Loader full />). -->
  <script>
    (function () {
      var sa = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
      if (!sa || !screen.height) return;
      // Hauteur réelle de l'écran (aussi pour les plein-écrans comme le lecteur d'actus : leur bas tombe sur le bas de l'écran)
      function set() {
        var land = innerWidth > innerHeight, h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        document.documentElement.style.setProperty('--splash-y', Math.round(h / 2) + 'px');
        document.documentElement.style.setProperty('--screen-h', h + 'px');
      }
      set(); addEventListener('orientationchange', function () { setTimeout(set, 300); });
    })();
  </script>
  <div class="bh-splash" id="bh-splash" role="status" aria-label="Chargement">
    <svg class="cc-anim" width="150" height="150" viewBox="0 0 140 140" aria-hidden="true">
      <line class="cc-l" x1="0" y1="70" x2="140" y2="70" /><circle class="cc-o" cx="70" cy="70" r="48" /><circle class="cc-n" cx="70" cy="70" r="20" />
      <g class="cc-logo"><circle cx="70" cy="70" r="40" class="cc-disc" /><image class="em-l" href="/icons/emblem-light.png" x="38" y="38" width="64" height="64" /><image class="em-d" href="/icons/emblem-dark.png" x="38" y="38" width="64" height="64" /></g>
    </svg>
    <div class="bh-wm"><span>Be</span><b>Hoop</b></div>
  </div>
  <div id="root"></div>
  <style>
    .bh-splash { position: fixed; inset: 0; z-index: 1000; transition: opacity .35s ease; background: #f4f1ec; font-family: Sora, 'Avenir Next', sans-serif; }
    /* Positions fixes (pas de centrage par la hauteur du contenu) : le chargement de la police ou des styles de l'appli
       ne fait plus bouger l'animation. Même placement que <Loader full /> (theme.css). */
    .bh-splash .cc-anim { position: absolute; left: 50%; top: var(--splash-y, 50%); margin: -95px 0 0 -75px; }
    .bh-splash .bh-wm { position: absolute; left: 0; right: 0; top: var(--splash-y, 50%); margin-top: 69px; height: 26px; line-height: 26px; text-align: center; white-space: nowrap; }
    .bh-wm { font-size: 22px; letter-spacing: -.035em; } .bh-wm span { font-weight: 300; color: #0d2a5c; } .bh-wm b { font-weight: 700; color: #f26a1b; }
    @media (prefers-color-scheme: dark) { .bh-splash { background: #070b14; } .bh-wm span { color: #fff !important; } }
/* Ouverture : rond central qui se trace, puis logo sur disque clair (les lignes s'effacent derrière) */
.cc-anim { overflow: visible; }
.cc-anim .cc-l, .cc-anim .cc-o, .cc-anim .cc-n { fill: none; stroke-linecap: round; }
.cc-anim .cc-o { stroke: #f26a1b; stroke-width: 3; stroke-dasharray: 302; animation: cc-draw 2.8s cubic-bezier(.6,0,.2,1) infinite; --l: 302; }
.cc-anim .cc-n { stroke: #0d2a5c; stroke-width: 2; stroke-dasharray: 126; animation: cc-draw 2.8s .2s cubic-bezier(.6,0,.2,1) infinite; --l: 126; }
.cc-anim .cc-l { stroke: #0d2a5c; stroke-width: 2; stroke-dasharray: 140; animation: cc-draw 2.8s .1s cubic-bezier(.6,0,.2,1) infinite; --l: 140; }
.cc-anim .cc-disc { fill: #f4f1ec; }
.cc-anim .cc-logo { transform-box: view-box; transform-origin: 70px 70px; animation: cc-pop 2.8s infinite; }
.cc-anim .em-d, .ball-anim .em-d { display: none; }
@keyframes cc-draw { 0% { stroke-dashoffset: var(--l); opacity: 1; } 38% { stroke-dashoffset: 0; opacity: 1; } 52%, 86% { stroke-dashoffset: 0; opacity: .35; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes cc-pop { 0%, 36% { transform: scale(0) rotate(-90deg); opacity: 0; } 50% { transform: scale(1.1) rotate(6deg); opacity: 1; } 58%, 86% { transform: scale(1) rotate(0); opacity: 1; } 100% { transform: scale(.92); opacity: 0; } }
    @media (prefers-color-scheme: dark) { .cc-anim .cc-n, .cc-anim .cc-l { stroke: #fff; } .cc-anim .cc-disc { fill: #070b14; } .cc-anim .em-l { display: none; } .cc-anim .em-d { display: inline; } }
    @media (prefers-reduced-motion: reduce) { .cc-anim * { animation: none !important; } }
  </style>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
