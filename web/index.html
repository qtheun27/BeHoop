<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="BeHoop — suis tes clubs de basket, résultats, vidéos de match et plus." />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&family=Sora:wght@300;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
  <title>BeHoop</title>
</head>
<body>
  <!-- Écran d'ouverture : affiché tout de suite, remplacé par l'appli dès qu'elle démarre (même animation que <Loader full />) -->
  <div id="root"><div class="bh-splash" role="status" aria-label="Chargement">
    <div class="bh-ball"><picture><source srcset="/icons/emblem-dark.png" media="(prefers-color-scheme: dark)" /><img src="/icons/emblem-light.png" alt="" /></picture><i></i></div>
    <div class="bh-wm"><span>Be</span><b>Hoop</b></div>
  </div></div>
  <style>
    .bh-splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: #f4f1ec; font-family: Sora, 'Avenir Next', sans-serif; }
    @media (prefers-color-scheme: dark) { .bh-splash { background: #070b14; } .bh-wm span { color: #fff !important; } }
    .bh-ball { position: relative; width: 84px; height: 110px; }
    .bh-ball img { position: absolute; left: 0; top: 0; width: 84px; height: 84px; object-fit: contain; animation: bhb 1s cubic-bezier(.45,0,.55,1) infinite; transform-origin: 50% 100%; }
    .bh-ball i { position: absolute; left: 22px; bottom: 0; width: 40px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.18); animation: bhs 1s cubic-bezier(.45,0,.55,1) infinite; }
    .bh-wm { font-size: 22px; letter-spacing: -.035em; } .bh-wm span { font-weight: 300; color: #0d2a5c; } .bh-wm b { font-weight: 700; color: #f26a1b; }
    @keyframes bhb { 0%, 100% { transform: translateY(-22px); } 45% { transform: translateY(0); } 52% { transform: translateY(2px) scale(1.08, .9); } 60% { transform: translateY(-2px) scale(.97, 1.03); } }
    @keyframes bhs { 0%, 100% { transform: scaleX(.55); opacity: .35; } 50% { transform: scaleX(1); opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .bh-ball img, .bh-ball i { animation: none; } }
  </style>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
