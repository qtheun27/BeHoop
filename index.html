<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Basketball Hainaut</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5cab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Basket Hainaut">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<style>
  :root {
    --primary: #0b5cab;
    --accent: #d32f2f;
    --bg: #f2f4f8;
    --card-bg: #ffffff;
    --text: #16202e;
    --muted: #64748b;
    --border: #e6e9ef;
    --border-soft: #f1f3f7;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #e6edf3;
      --muted: #8b96a5;
      --border: #2a313c;
      --border-soft: #1f242d;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding-bottom: calc(24px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .container { max-width: 720px; margin: auto; padding: 0 14px; }

  /* ---- En-tête sticky ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--card-bg) 92%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + var(--safe-top)) 14px 12px;
  }
  header .titre-app {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 17px; margin-bottom: 10px;
  }
  .search-box { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); font-size: 16px;
    background: var(--bg); color: var(--text);
  }
  input[type="text"]:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  button.btn-main {
    padding: 12px 18px; background: var(--primary); color: white; border: none;
    border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px;
    white-space: nowrap;
  }
  button.btn-main:disabled { background: #b7c3d6; cursor: not-allowed; }
  button.btn-main:active { transform: scale(0.97); }
  #status { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

  main { padding-top: 14px; }

  /* ---- Bannière club ---- */
  .club-banner {
    background: var(--primary);
    color: white;
    padding: 18px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px -8px color-mix(in srgb, var(--primary) 60%, transparent);
  }
  .club-banner-logo {
    height: 58px; width: 58px; object-fit: contain; background: white;
    padding: 6px; border-radius: 12px; flex-shrink: 0;
  }
  .club-banner h1 { margin: 0; font-size: 19px; line-height: 1.25; }
  .club-banner .adresse { font-size: 12.5px; opacity: 0.9; margin-top: 3px; }
  .agenda-btn {
    margin-left: auto; flex-shrink: 0; background: rgba(255,255,255,0.18);
    border: none; color: white; width: 40px; height: 40px; border-radius: 50%;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .agenda-btn:active { background: rgba(255,255,255,0.3); }

  /* ---- Puces équipes ---- */
  .team-selector {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px;
    margin-bottom: 4px; scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .team-selector::-webkit-scrollbar { display: none; }
  .team-chip {
    padding: 10px 16px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13.5px;
    font-weight: 700; scroll-snap-align: start; flex-shrink: 0;
  }
  .team-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* ---- Onglets ---- */
  .tabs {
    display: flex; gap: 4px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; margin: 10px 0 14px;
  }
  .tab-btn {
    flex: 1; padding: 10px; background: none; border: none; border-radius: 9px;
    font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .tab-btn.active { background: var(--primary); color: white; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .carte {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }

  /* ---- Classement ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 5px; text-align: left; border-bottom: 1px solid var(--border-soft); }
  th { color: var(--muted); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  td:first-child, th:first-child { padding-left: 2px; }
  tr.ligne-equipe { background: color-mix(in srgb, var(--primary) 10%, transparent); }
  tr.ligne-equipe td { font-weight: 800; }

  /* ---- Filtres calendrier ---- */
  .filtres { display: flex; gap: 6px; margin-bottom: 12px; }
  .filtre-chip {
    padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--muted); font-size: 12.5px; font-weight: 700;
    cursor: pointer;
  }
  .filtre-chip.active { background: var(--text); color: var(--card-bg); border-color: var(--text); }

  .mois-titre {
    font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin: 18px 2px 8px;
  }
  .mois-titre:first-child { margin-top: 2px; }

  .prochain-match {
    border: 1.5px solid var(--primary); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 16px;
    background: color-mix(in srgb, var(--primary) 6%, var(--card-bg));
  }
  .prochain-label {
    font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 6px;
  }

  /* ---- Carte match ---- */
  .game-card {
    background: var(--card-bg); border: 1px solid var(--border-soft);
    border-left: 3px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .game-card.victoire { border-left-color: #1f9d55; }
  .game-card.defaite { border-left-color: var(--accent); }
  .game-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .game-type { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; }
  .game-type.championnat { color: var(--primary); }
  .game-type.coupe { color: #b45309; }
  .game-type.amical { color: var(--muted); }
  .game-date { font-size: 12px; color: var(--muted); }
  .game-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 3px 0; }
  .game-row .club-nom { font-size: 14px; color: var(--muted); font-weight: 500; }
  .game-row .club-nom.notre-equipe { color: var(--text); font-weight: 700; }
  .game-row .pts { font-size: 14px; color: var(--muted); flex-shrink: 0; }
  .game-row.notre-ligne .pts { color: var(--text); font-weight: 700; }
  .game-card.victoire .game-row.notre-ligne .pts { color: #1f9d55; }
  .game-card.defaite .game-row.notre-ligne .pts { color: var(--accent); }

  .game-venue {
    display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border-soft); position: relative;
  }
  .venue-btn {
    flex: 1; text-align: left; font-size: 12px; color: var(--muted); background: none; border: none;
    padding: 0; cursor: pointer; font-family: inherit;
  }
  .venue-chevron { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .venue-menu, .agenda-menu {
    display: none; position: absolute; z-index: 30; top: 20px; left: 0;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18); overflow: hidden; min-width: 180px;
  }
  .agenda-menu { top: 46px; left: auto; right: 0; min-width: 240px; }
  .venue-menu.ouvert, .agenda-menu.ouvert { display: block; }
  .venue-menu a, .agenda-menu a {
    display: block; padding: 10px 14px; font-size: 13px; color: var(--text); text-decoration: none;
  }
  .agenda-menu a { font-size: 13px; }
  .agenda-menu .sous-texte { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; font-weight: 400; }
  .venue-menu a:hover, .agenda-menu a:hover { background: var(--border-soft); }
  .agenda-menu-wrap { position: relative; }

  .vide { color: var(--muted); font-size: 13.5px; padding: 6px 2px; line-height: 1.5; }
  footer { text-align: center; color: var(--muted); font-size: 11.5px; padding: 18px 14px; }
</style>
</head>
<body>

<header>
  <div class="titre-app">🏀 Suivi Basket Hainaut</div>
  <div class="search-box">
    <input type="text" id="club-input" list="clubs-list" placeholder="Rechercher un club..." disabled>
    <datalist id="clubs-list"></datalist>
    <button class="btn-main" id="btn-search" disabled>OK</button>
  </div>
  <div id="status">Chargement des données...</div>
</header>

<main class="container">
  <div id="club-view" style="display:none;">
    <div class="club-banner">
      <img class="club-banner-logo" id="club-logo" src="" alt="" style="display:none;" onerror="this.style.display='none'">
      <div style="min-width:0;">
        <h1 id="club-name"></h1>
        <div class="adresse" id="club-adresse"></div>
      </div>
      <div class="agenda-menu-wrap">
        <button class="agenda-btn" id="btn-agenda" title="S'abonner à l'agenda de l'équipe">📆</button>
        <div class="agenda-menu" id="agenda-menu"></div>
      </div>
    </div>

    <div class="team-selector" id="team-selector"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-classement">📊 Classement</button>
      <button class="tab-btn" data-tab="tab-calendrier">📅 Calendrier</button>
    </div>

    <div id="tab-classement" class="tab-content active"><div class="carte" id="classement-carte"></div></div>
    <div id="tab-calendrier" class="tab-content">
      <div class="filtres" id="filtres-calendrier">
        <button class="filtre-chip active" data-filtre="avenir">À venir</button>
        <button class="filtre-chip" data-filtre="termines">Terminés</button>
        <button class="filtre-chip" data-filtre="tous">Tous</button>
      </div>
      <div id="calendrier-contenu"></div>
    </div>
  </div>

  <div id="etat-vide" class="carte vide" style="text-align:center; padding:30px 16px;">
    👋 Cherche un club ci-dessus pour voir ses équipes, classements et calendriers.
  </div>
</main>

<footer id="pied"></footer>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

let donnees = null;
let clubCourant = null;
let equipeCourante = null;
let filtreCalendrier = 'avenir';

const $status = document.getElementById('status');
const $input = document.getElementById('club-input');
const $btn = document.getElementById('btn-search');
const $liste = document.getElementById('clubs-list');
const $vue = document.getElementById('club-view');
const $etatVide = document.getElementById('etat-vide');

const EMOJI_TYPE = { coupe: '🏆', amical: '🤝', championnat: '🏀' };
const LABEL_TYPE = { coupe: 'Coupe', amical: 'Amical', championnat: 'Championnat' };

function formatAdresse(club) {
  const v = club.venue;
  if (v && (v.street || v.city)) {
    return `📍 ${v.name || 'Salle'} — ${v.street || ''}${v.street2 ? ', ' + v.street2 : ''}, ${v.zip || ''} ${v.city || ''}`;
  }
  if (club.street || club.city) return `📍 ${club.street || ''}, ${club.zip || ''} ${club.city || ''}`;
  return '';
}

function formatDate(dateStr, timeStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T' + (timeStr || '00:00:00'));
  const jour = d.toLocaleDateString('fr-BE', { weekday: 'short', day: '2-digit', month: '2-digit' });
  const heure = timeStr ? d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' }) : '';
  return heure ? `${jour}\n${heure}` : jour;
}

function nomMois(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const s = d.toLocaleDateString('fr-BE', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function serieDeEquipe(teamId) {
  for (const [serieId, lignes] of Object.entries(donnees.classements || {})) {
    if (lignes.some(l => l.team_id === teamId)) return parseInt(serieId, 10);
  }
  for (const g of donnees.games || []) {
    if (g.home_team_id === teamId) return g.serie_id;
    if (g.away_team_id === teamId) return g.serie_id;
  }
  return null;
}

function rendreClassement(equipe) {
  const serieId = serieDeEquipe(equipe.id);
  const lignes = serieId ? (donnees.classements[String(serieId)] || []) : [];
  const serie = (donnees.series || []).find(s => s.id === serieId);
  const cible = document.getElementById('classement-carte');

  if (lignes.length === 0) {
    cible.innerHTML = `<p class="vide">Classement pas encore disponible${serie ? ' pour ' + (serie.name || serie.short_name) : ''} — la saison n'a pas encore débuté ou aucun match n'est validé.</p>`;
    return;
  }

  const tri = [...lignes].sort((a, b) => (a.position || 999) - (b.position || 999));
  const rangees = tri.map(l => `
    <tr class="${l.team_id === equipe.id ? 'ligne-equipe' : ''}">
      <td>${l.position ?? '-'}</td>
      <td>${l.team_short_name || l.team_name}</td>
      <td>${l.played ?? 0}</td>
      <td>${l.wins ?? 0}</td>
      <td>${l.losses ?? 0}</td>
      <td>${l.points ?? 0}</td>
    </tr>
  `).join('');

  cible.innerHTML = `
    <h3 style="margin:0 0 10px;font-size:14px;">${serie ? (serie.name || serie.short_name) : ''}</h3>
    <table>
      <thead><tr><th>#</th><th>Équipe</th><th>J</th><th>G</th><th>P</th><th>Pts</th></tr></thead>
      <tbody>${rangees}</tbody>
    </table>
  `;
}

function adresseComplete(g) {
  return [g.venue_name, g.venue_street, g.venue_zip, g.venue_city].filter(Boolean).join(', ');
}

function toggleMenu(id) {
  document.querySelectorAll('.venue-menu.ouvert, .agenda-menu.ouvert').forEach(m => {
    if (m.id !== id) m.classList.remove('ouvert');
  });
  const menu = document.getElementById(id);
  if (menu) menu.classList.toggle('ouvert');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.game-venue') && !e.target.closest('.agenda-menu-wrap')) {
    document.querySelectorAll('.venue-menu.ouvert, .agenda-menu.ouvert').forEach(m => m.classList.remove('ouvert'));
  }
});

function carteMatch(g, equipe, venueId) {
  const domicile = g.home_team_id === equipe.id;
  const joue = g.game_status_id === 2 && g.home_score !== null && g.home_score !== undefined;
  let classeCarte = '';
  if (joue) {
    const gagne = domicile ? g.home_score > g.away_score : g.away_score > g.home_score;
    classeCarte = gagne ? 'victoire' : 'defaite';
  }
  const nomDomicile = g.home_team_short_name || g.home_team_name;
  const nomExterieur = g.away_team_short_name || g.away_team_name;
  const adresse = adresseComplete(g);
  const q = encodeURIComponent(adresse);
  const type = g.match_type || 'championnat';

  const ligne = (nom, estNous, pts) => `
    <div class="game-row ${estNous ? 'notre-ligne' : ''}">
      <span class="club-nom ${estNous ? 'notre-equipe' : ''}">${nom}</span>
      <span class="pts">${pts}</span>
    </div>
  `;
  const ptsDomicile = joue ? g.home_score : '—';
  const ptsExterieur = joue ? g.away_score : '—';

  return `
    <div class="game-card ${classeCarte}">
      <div class="game-head">
        <div class="game-type ${type}">
          <span>${EMOJI_TYPE[type] || '🏀'}</span>
          <span>${LABEL_TYPE[type] || 'Championnat'}</span>
        </div>
        <div class="game-date">${formatDate(g.date, g.time).replace('\n', ' · ')}</div>
      </div>
      ${ligne(nomDomicile, domicile, ptsDomicile)}
      ${ligne(nomExterieur, !domicile, ptsExterieur)}
      ${g.venue_name ? `
      <div class="game-venue">
        <button class="venue-btn" onclick="toggleMenu('venue-menu-${venueId}')">📍 ${g.venue_name}</button>
        <span class="venue-chevron">›</span>
        <div class="venue-menu" id="venue-menu-${venueId}">
          <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google Maps</a>
          <a href="https://waze.com/ul?q=${q}&navigate=yes" target="_blank" rel="noopener">Waze</a>
          <a href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener">Plans (Apple)</a>
        </div>
      </div>` : ''}
    </div>
  `;
}

function rendreCalendrier(equipe) {
  const cible = document.getElementById('calendrier-contenu');
  const aujourdhui = new Date().toISOString().slice(0, 10);

  let matchs = (donnees.games || [])
    .filter(g => g.home_team_id === equipe.id || g.away_team_id === equipe.id)
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));

  if (matchs.length === 0) {
    cible.innerHTML = `<p class="vide">Aucun match trouvé pour cette équipe cette saison.</p>`;
    return;
  }

  let prochainHtml = '';
  if (filtreCalendrier === 'avenir') {
    const prochain = matchs.find(g => g.date >= aujourdhui);
    if (prochain) {
      prochainHtml = `
        <div class="prochain-match">
          <div class="prochain-label">⏭️ Prochain match</div>
          ${carteMatch(prochain, equipe, 'next')}
        </div>
      `;
    }
    matchs = matchs.filter(g => g.date >= aujourdhui && g !== prochain);
  } else if (filtreCalendrier === 'termines') {
    matchs = matchs.filter(g => g.date < aujourdhui || (g.game_status_id === 2 && g.home_score !== null));
  }

  if (matchs.length === 0 && !prochainHtml) {
    cible.innerHTML = `<p class="vide">Aucun match dans cette catégorie.</p>`;
    return;
  }

  const groupes = {};
  matchs.forEach(g => {
    const cle = (g.date || '').slice(0, 7);
    (groupes[cle] = groupes[cle] || []).push(g);
  });

  let html = prochainHtml;
  Object.keys(groupes).sort().forEach(cle => {
    html += `<div class="mois-titre">${nomMois(cle + '-01')}</div>`;
    html += groupes[cle].map((g, i) => carteMatch(g, equipe, cle + '-' + i)).join('');
  });

  cible.innerHTML = html || `<p class="vide">Aucun match dans cette catégorie.</p>`;
}

function selectionnerEquipe(equipe, chipEl) {
  equipeCourante = equipe;
  document.querySelectorAll('.team-chip').forEach(c => c.classList.remove('active'));
  if (chipEl) chipEl.classList.add('active');
  rendreClassement(equipe);
  rendreCalendrier(equipe);
  rendreMenuAgenda(equipe);
}

function rendreMenuAgenda(equipe) {
  const menu = document.getElementById('agenda-menu');
  const btn = document.getElementById('btn-agenda');
  if (!equipe.ics_url) {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'flex';
  const webcal = equipe.ics_url.replace(/^https?:\/\//, 'webcal://');
  const google = 'https://calendar.google.com/calendar/render?cid=' + encodeURIComponent(webcal);
  menu.innerHTML = `
    <a href="${webcal}">📱 S'abonner (Apple / iOS / macOS)<span class="sous-texte">Se met à jour automatiquement</span></a>
    <a href="${google}" target="_blank" rel="noopener">🗓️ S'abonner (Google Agenda)<span class="sous-texte">Se met à jour automatiquement</span></a>
    <a href="${equipe.ics_url}" target="_blank" rel="noopener">⬇️ Télécharger (.ics)<span class="sous-texte">Import ponctuel, pas de mise à jour</span></a>
  `;
}
document.getElementById('btn-agenda').addEventListener('click', () => toggleMenu('agenda-menu'));

function appliquerTheme(club) {
  document.documentElement.style.setProperty('--primary', club.primary_color || '#0b5cab');
  document.documentElement.style.setProperty('--accent', club.accent_color || '#d32f2f');
}

function afficherClub(club) {
  clubCourant = club;
  $vue.style.display = 'block';
  $etatVide.style.display = 'none';
  appliquerTheme(club);

  const logo = document.getElementById('club-logo');
  if (club.logo_url) { logo.src = club.logo_url; logo.style.display = 'block'; }
  else { logo.style.display = 'none'; }

  document.getElementById('club-name').textContent = club.name;
  document.getElementById('club-adresse').textContent = formatAdresse(club);

  const selecteur = document.getElementById('team-selector');
  selecteur.innerHTML = '';

  if (!club.teams || club.teams.length === 0) {
    selecteur.innerHTML = '<p class="vide">Aucune équipe active trouvée pour ce club cette saison.</p>';
    document.getElementById('classement-carte').innerHTML = '';
    document.getElementById('calendrier-contenu').innerHTML = '';
    document.getElementById('btn-agenda').style.display = 'none';
    return;
  }

  club.teams.forEach((equipe, i) => {
    const chip = document.createElement('div');
    chip.className = 'team-chip' + (i === 0 ? ' active' : '');
    chip.textContent = equipe.category || equipe.name;
    chip.title = equipe.name;
    chip.onclick = () => selectionnerEquipe(equipe, chip);
    selecteur.appendChild(chip);
  });

  selectionnerEquipe(club.teams[0], selecteur.firstChild);
}

function rechercher() {
  const texte = $input.value.trim().toLowerCase();
  if (!texte) return;
  const club = (donnees.clubs || []).find(c => (c.name || '').toLowerCase().includes(texte) || (c.short_name || '').toLowerCase().includes(texte));
  if (!club) { alert('Club introuvable. Essayez un autre mot-clé.'); return; }
  afficherClub(club);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

document.querySelectorAll('.filtre-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filtre-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtreCalendrier = btn.dataset.filtre;
    if (equipeCourante) rendreCalendrier(equipeCourante);
  });
});

$btn.addEventListener('click', rechercher);
$input.addEventListener('keydown', e => { if (e.key === 'Enter') rechercher(); });

window.onload = async function () {
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (!res.ok) throw new Error('data.json introuvable');
    donnees = await res.json();

    const noms = (donnees.clubs || []).map(c => c.short_name || c.name).sort();
    noms.forEach(nom => {
      const opt = document.createElement('option');
      opt.value = nom;
      $liste.appendChild(opt);
    });

    const totalEquipes = (donnees.clubs || []).reduce((s, c) => s + (c.teams || []).length, 0);
    $status.textContent = `✅ ${(donnees.clubs || []).length} clubs, ${totalEquipes} équipes — saison ${(donnees.season || {}).name || ''}`;
    $input.disabled = false;
    $btn.disabled = false;

    const genere = donnees.generated_at ? new Date(donnees.generated_at).toLocaleString('fr-BE') : '';
    document.getElementById('pied').textContent = genere ? `Dernière mise à jour : ${genere}` : '';
  } catch (err) {
    $status.textContent = "⏳ Données en cours d'initialisation par le robot. Réessayez dans quelques minutes.";
  }
};
</script>
