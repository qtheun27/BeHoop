<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Basket Hainaut</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 20px; max-width: 900px; margin: auto; color: #333; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { color: #d32f2f; display: flex; align-items: center; gap: 10px; }
        input[type="text"] { width: 100%; max-width: 400px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-right: 10px; box-sizing: border-box; }
        button { padding: 12px 20px; background: #d32f2f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { font-size: 14px; font-weight: 500; margin-bottom: 15px; }
        .status.success { color: #2e7d32; }
        .status.warning { color: #ed6c02; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

    <h1>🏀 Suivi Basket Hainaut</h1>

    <div class="card">
        <h2>Rechercher un club</h2>
        <div id="status-msg" class="status warning">⏳ Chargement des données...</div>
        
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="club-input" list="clubs-list" placeholder="Ex: Mons, Charleroi, Tournai..." disabled>
            <datalist id="clubs-list"></datalist>
            <button id="search-btn" onclick="afficherClub()" disabled>Voir les données</button>
        </div>
    </div>

    <div class="card" id="results-card" style="display: none;">
        <h3 id="club-title"></h3>
        <div id="club-content"></div>
    </div>

    <script>
        let appData = null;

        window.onload = async function() {
            const statusMsg = document.getElementById('status-msg');
            try {
                const res = await fetch('./data.json?t=' + new Date().getTime());
                appData = await res.json();

                const datalist = document.getElementById('clubs-list');
                const clubNames = Object.keys(appData.clubs || {});

                clubNames.forEach(nom => {
                    const opt = document.createElement('option');
                    opt.value = nom;
                    datalist.appendChild(opt);
                });

                if (clubNames.length > 0) {
                    statusMsg.className = "status success";
                    statusMsg.textContent = `✅ Données prêtes (${clubNames.length} clubs chargés)`;
                    document.getElementById('club-input').disabled = false;
                    document.getElementById('search-btn').disabled = false;
                } else {
                    statusMsg.textContent = "⚠️ Le fichier de données est vide. Relancez l'action GitHub.";
                }
            } catch (err) {
                statusMsg.textContent = "⚠️ Impossible de charger data.json. L'action GitHub doit tourner au moins une fois.";
            }
        };

        function afficherClub() {
            const query = document.getElementById('club-input').value.trim().toLowerCase();
            const resultsCard = document.getElementById('results-card');
            const clubTitle = document.getElementById('club-title');
            const clubContent = document.getElementById('club-content');

            if (!query || !appData) return;

            let targetId = null;
            let targetName = null;

            for (const [nom, id] of Object.entries(appData.clubs)) {
                if (nom.toLowerCase().includes(query)) {
                    targetId = id;
                    targetName = nom;
                    break;
                }
            }

            resultsCard.style.display = "block";

            if (!targetId) {
                clubTitle.textContent = "Aucun résultat";
                clubContent.innerHTML = "<p style='color:red;'>Club introuvable. Essayez un autre nom.</p>";
                return;
            }

            clubTitle.textContent = targetName;
            const info = appData.donnees_clubs[targetId] || {};

            let html = `<p><strong>Matricule / ID :</strong> ${targetId}</p>`;
            if (info.address) html += `<p><strong>Adresse :</strong> ${info.address}</p>`;
            if (info.locality) html += `<p><strong>Localité :</strong> ${info.locality}</p>`;
            if (info.mail) html += `<p><strong>Email :</strong> <a href="mailto:${info.mail}">${info.mail}</a></p>`;

            clubContent.innerHTML = html;
        }
    </script>
</body>
</html>
