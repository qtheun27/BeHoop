name: Moments forts du match (analyse)

# Après chaque montage (render.yml), ou à la main : « all » analyse toutes les vidéos prêtes qui ne l'ont pas encore été.
on:
  workflow_dispatch:
    inputs:
      matchVideoId:
        description: 'Identifiant de la vidéo (matchVideos/{id}) ou « all »'
        required: true
  workflow_call:
    inputs:
      matchVideoId: { type: string, required: true }
    secrets:
      FIREBASE_SERVICE_ACCOUNT: { required: true }
      R2_ACCOUNT_ID: { required: true }
      R2_ACCESS_KEY_ID: { required: true }
      R2_SECRET_ACCESS_KEY: { required: true }
      R2_BUCKET: { required: true }

concurrency:
  group: highlights-${{ inputs.matchVideoId }}
  cancel-in-progress: false

jobs:
  highlights:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data.json
            !/calendars/
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Analyse
        run: npx tsx ops/render/highlights.ts "${{ inputs.matchVideoId }}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
