name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'worker/**', 'ops/**', 'tests/**', 'firestore.rules']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --ignore-scripts --no-audit --no-fund  # sans téléchargements annexes (ffmpeg…) : une panne de GitHub ne bloque plus les tests
      - name: Tests unitaires
        run: npm test
      - name: Types (appli, scripts, Worker)
        run: npx tsc -p tsconfig.json --noEmit && npx tsc -p worker/tsconfig.json
      - name: Règles Firestore (émulateur)
        run: npm run test:rules
      - name: Bout en bout (émulateur + match test)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
