name: Montage vidéo de match

# Déclenché par le Worker (workflow_dispatch) quand un utilisateur clique sur « Générer ».
on:
  workflow_dispatch:
    inputs:
      matchVideoId:
        description: 'Identifiant du montage (matchVideos/{id})'
        required: true

concurrency:
  group: render-${{ inputs.matchVideoId }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data.json
            !/calendars/
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Compiler la page des planches
        run: npx vite build --config web/vite.config.ts
      - name: Montage
        run: npx tsx ops/render/run.ts "${{ inputs.matchVideoId }}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
