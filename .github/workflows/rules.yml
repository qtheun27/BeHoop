name: Règles et index Firestore — publication

# Publie firestore.rules et firestore.indexes.json en production dès qu'il change sur main, après les tests des règles sur l'émulateur.
# Utilise le secret FIREBASE_SERVICE_ACCOUNT (compte de service Firebase). S'il n'a pas le droit de publier les règles,
# l'étape échoue : publier alors firestore.rules à la main (console Firebase → Firestore → Règles). Voir ops/deploy-rules.ts.
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firestore.indexes.json', '.github/workflows/rules.yml']
  workflow_dispatch:

concurrency: { group: rules-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --no-audit --no-fund
      - name: Tests des règles (émulateur)
        run: npm run test:rules
      - name: Publication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT absent : publier firestore.rules à la main."; exit 0; fi
          npx tsx ops/deploy-rules.ts
