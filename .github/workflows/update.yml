name: Mise à jour automatique AWBB

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le robot de scraping
        run: python scraper.py

      - name: Enregistrer les changements dans GitHub
        run: |
          git config --global user.name "AWBB Auto-Bot"
          git config --global user.email "bot@github.com"
          touch data.json
          git add data.json
          git commit -m "🤖 Mise à jour automatique des données AWBB" || echo "Rien à commiter"
          git push
