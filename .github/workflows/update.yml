name: Mise à jour automatique Basket Hainaut

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests pillow

      - name: Interroger l'API Basket Hainaut
        run: python scraper.py

      # --- BeHoop Social (ajouts) : ces étapes ne peuvent jamais bloquer la mise à jour du site ---
      - name: Installer Node (appli BeHoop)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        continue-on-error: true

      - name: Dépendances Node
        run: npm ci --ignore-scripts --no-audit --no-fund
        continue-on-error: true

      - name: Clubs de Flandre (Basketbal Vlaanderen)
        run: npx tsx ops/vbl.ts
        continue-on-error: true

      - name: BNXT League, NBA et Belgian Lions
        run: npx tsx ops/pro.ts
        continue-on-error: true

      - name: Copie locale des logos de clubs
        run: python ops/logos.py
        continue-on-error: true

      - name: Données allégées pour l'appli (app-data/)
        run: npx tsx ops/build-app-data.ts
        continue-on-error: true

      - name: Actualités basket
        run: npx tsx ops/news.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      - name: Cartes de score automatiques et Jeunes/Seniors (Firestore)
        run: npx tsx ops/sync-scores.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Enregistrer les changements dans GitHub
        run: |
          git config --global user.name "AWBB Auto-Bot"
          git config --global user.email "bot@github.com"
          touch data.json
          git add data.json calendars/
          git add app-data/ vbl.json pro.json logos/ || true
          git commit -m "🤖 Mise à jour automatique saison en cours" || echo "Rien à commiter"
          # Si quelqu'un a poussé pendant la mise à jour, nos fichiers générés l'emportent
          # (ils sont de toute façon recalculés à chaque passage) ; jusqu'à 3 essais.
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
