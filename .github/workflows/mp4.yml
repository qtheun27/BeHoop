name: Fichier MP4 (publication YouTube)

# Déclenché par le Worker quand on demande le fichier MP4 d'une vidéo de match (bouton « Publier sur YouTube »).
on:
  workflow_dispatch:
    inputs:
      matchVideoId:
        description: 'Identifiant de la vidéo (matchVideos/{id})'
        required: true
      quality:
        description: '1080p ou 720p'
        required: false
        default: '1080p'

concurrency:
  group: mp4-${{ inputs.matchVideoId }}-${{ inputs.quality }}
  cancel-in-progress: false

jobs:
  mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data.json
            !/calendars/
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assemblage du MP4
        run: npx tsx ops/render/mp4.ts "${{ inputs.matchVideoId }}" "${{ inputs.quality }}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
