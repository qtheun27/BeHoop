<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tableau de bord — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .profil-hero { text-align: center; padding: 8px 0 4px; }
  .profil-hero .avatar { margin: 0 auto 12px; box-shadow: var(--shadow-md); }
  .profil-hero h1 { font-size: 19px; margin: 0 0 6px; }
  .profil-hero .email { color: var(--text-muted); font-size: 13px; }
  .lien-action {
    display: flex; align-items: center; gap: 12px; padding: 14px; margin-top: 10px;
    background: var(--surface-2); border-radius: var(--radius-md); text-decoration: none; color: var(--text);
  }
  .lien-action .icone { font-size: 20px; }
  .lien-action .texte { flex: 1; font-weight: 700; font-size: 14px; }
  .lien-action .fleche { color: var(--text-muted); }
</style>
</head>
<body>
<div class="app-bar">
  <span class="titre"><img src="../icons/icon-192.png" alt="" style="width:22px;height:22px;border-radius:6px;vertical-align:-5px;margin-right:2px;"> BeHoop<small>Espace Club</small></span>
  <a href="../index.html" style="flex-shrink:0;font-size:12px;font-weight:700;color:var(--primary);text-decoration:none;border:1px solid var(--border);padding:6px 12px;border-radius:20px;">🌐 Site public</a>
</div>
<div class="container" style="padding-top:18px;">
  <div class="carte profil-hero" id="carte-profil">
    <div class="skel" style="width:76px;height:76px;border-radius:50%;margin:0 auto 12px;"></div>
    <div class="skel" style="width:140px;height:16px;margin:0 auto 8px;"></div>
    <div class="skel" style="width:100px;height:12px;margin:0 auto;"></div>
  </div>

  <div class="carte" id="carte-liens" style="display:none;">
    <div class="carte-titre">Mon espace</div>
  </div>

  <div class="carte">
    <button class="btn btn-secondary btn-block" id="btn-deconnexion">Se déconnecter</button>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml, nomAffichage } from "./avatar.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const LABEL_ROLE = { super_admin: 'Super administrateur', club_admin: 'Administrateur de club', coach: 'Coach', player: 'Joueur', parent: 'Parent' };
const ROUTE_ROLE = { super_admin: './admin.html', club_admin: './mon-club.html', coach: './coach.html', player: './joueur.html', parent: './parent.html' };
const LABEL_LIEN = { super_admin: 'Console super admin', club_admin: 'Gérer mon club', coach: 'Mon équipe (entraînements, stats)', player: 'Mon équipe', parent: 'Mes enfants' };
const ICONE_LIEN = { super_admin: '🛠️', club_admin: '🏀', coach: '🏀', player: '🏀', parent: '👨‍👩‍👧' };

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) { window.location.href = './index.html'; return; }
  const profil = snap.data();

  let nomClub = profil.club_name || null;
  if (!nomClub && profil.club_id) {
    try {
      const res = await fetch('../data.json?t=' + Date.now());
      const donnees = await res.json();
      const club = (donnees.clubs || []).find(c => String(c.id) === String(profil.club_id));
      nomClub = club ? club.name : null;
    } catch (e) { /* pas grave */ }
  }
  const ligneClub = profil.club_id ? (nomClub || 'club ' + profil.club_id) : '';

  document.getElementById('carte-profil').innerHTML = `
    ${avatarHtml(profil.photo_url, nomAffichage(profil), 76)}
    <h1>${nomAffichage(profil)}</h1>
    <span class="badge badge-primary">${LABEL_ROLE[profil.role] || profil.role}</span>
    <div class="email" style="margin-top:8px;">${user.email}${ligneClub ? ' · ' + ligneClub : ''}</div>
  `;

  const $liens = document.getElementById('carte-liens');
  let html = '<div class="carte-titre">Mon espace</div>';
  if (ROUTE_ROLE[profil.role]) {
    html += `
      <a class="lien-action" href="${ROUTE_ROLE[profil.role]}">
        <span class="icone">${ICONE_LIEN[profil.role]}</span>
        <span class="texte">${LABEL_LIEN[profil.role]}</span>
        <span class="fleche">→</span>
      </a>
    `;
  }
  html += `
    <a class="lien-action" href="./compte.html">
      <span class="icone">⚙️</span>
      <span class="texte">Mon compte (photo, mot de passe)</span>
      <span class="fleche">→</span>
    </a>
  `;
  $liens.innerHTML = html;
  $liens.style.display = 'block';
});

document.getElementById('btn-deconnexion').addEventListener('click', async () => {
  await signOut(auth);
  window.location.href = './index.html';
});
</script>
</body>
</html>
