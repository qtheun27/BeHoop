<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeHoop">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<title>Console Super Admin — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .item-club { display: flex; justify-content: space-between; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--border-soft); cursor: pointer; font-size: 14px; }
  .item-club:last-child { border-bottom: none; }
  .item-club:active { background: var(--surface-2); }
  .liste-clubs { max-height: 280px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 10px; }
  .club-selectionne { background: var(--primary-tint); border: 1px solid var(--primary); border-radius: var(--radius-md); padding: 14px; margin-top: 14px; }
</style>
</head>
<body>
<div class="app-bar">
  <a class="retour cache-si-nav-basse" href="./dashboard.html">←</a>
  <span class="titre">🛠️ Console Super Admin</span>
</div>
<div class="container" style="padding-top:16px;">

  <div class="carte">
    <div class="carte-titre">Assigner un administrateur</div>
    <div class="carte-desc">Recherche un club du Hainaut (déjà connu du site) puis invite son administrateur.</div>
    <input type="text" id="recherche-club" placeholder="Rechercher un club...">
    <div class="liste-clubs" id="liste-clubs"></div>
    <div id="club-selectionne" style="display:none;"></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Invitations envoyées</div>
    <div id="corps-invitations"><p class="vide">Chargement…</p></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Tous les membres</div>
    <div class="carte-desc">Admins de club, coachs, joueurs, parents — tous clubs confondus.</div>
    <div id="corps-membres"><p class="vide">Chargement…</p></div>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { rendreNav } from "./nav.js";
import { avatarHtml, nomAffichage } from "./avatar.js";

const SITE_URL_CONNEXION = "https://behoop.be/club/finaliser-connexion.html";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let tousLesClubs = [];
let adminsParClub = {};
let clubActif = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'super_admin') {
    window.location.href = './dashboard.html';
    return;
  }

  rendreNav('super_admin', 'espace');
  await chargerClubsAwbb();
  await chargerAdminsExistants();
  await chargerInvitations();
  await chargerMembres();
});

async function chargerClubsAwbb() {
  const res = await fetch('../data.json?t=' + Date.now());
  const donnees = await res.json();
  tousLesClubs = donnees.clubs || [];
  afficherListeClubs(tousLesClubs);
}

async function chargerAdminsExistants() {
  const q = query(collection(db, 'users'), where('role', '==', 'club_admin'));
  const snap = await getDocs(q);
  adminsParClub = {};
  snap.forEach(d => { adminsParClub[d.data().club_id] = d.data().email; });
}

function afficherListeClubs(clubs) {
  const $liste = document.getElementById('liste-clubs');
  $liste.innerHTML = clubs.slice(0, 50).map(c => {
    const aUnAdmin = !!adminsParClub[String(c.id)];
    return `
      <div class="item-club" data-id="${c.id}" data-nom="${(c.name || '').replace(/"/g, '&quot;')}">
        <span>${c.name}</span>
        <span class="badge ${aUnAdmin ? 'badge-success' : 'badge-muted'}">${aUnAdmin ? 'Admin ✓' : 'Sans admin'}</span>
      </div>
    `;
  }).join('') || '<p class="vide" style="padding:10px 0;">Aucun club trouvé.</p>';

  $liste.querySelectorAll('.item-club').forEach(el => {
    el.addEventListener('click', () => selectionnerClub(el.dataset.id, el.dataset.nom));
  });
}

document.getElementById('recherche-club').addEventListener('input', (e) => {
  const texte = e.target.value.trim().toLowerCase();
  const filtres = texte
    ? tousLesClubs.filter(c => (c.name || '').toLowerCase().includes(texte))
    : tousLesClubs;
  afficherListeClubs(filtres);
});

function selectionnerClub(clubId, nomClub) {
  clubActif = { id: clubId, name: nomClub };
  const adminActuel = adminsParClub[String(clubId)];
  const $zone = document.getElementById('club-selectionne');
  $zone.style.display = 'block';
  $zone.innerHTML = `
    <strong>${nomClub}</strong>
    ${adminActuel
      ? `<p class="vide" style="margin-top:6px;">Administrateur actuel : ${adminActuel}</p>`
      : `
        <label class="champ-label" for="email-admin">Email du futur administrateur</label>
        <input type="email" id="email-admin" placeholder="admin@club.be">
        <button class="btn btn-primary" style="margin-top:12px;" id="btn-inviter">Envoyer l'invitation</button>
        <div class="msg" id="msg-invite"></div>
      `}
  `;
  if (!adminActuel) {
    document.getElementById('btn-inviter').addEventListener('click', envoyerInvitationAdmin);
  }
}

async function envoyerInvitationAdmin() {
  const email = document.getElementById('email-admin').value.trim().toLowerCase();
  const $msg = document.getElementById('msg-invite');
  if (!email || !email.includes('@')) {
    $msg.className = 'msg err'; $msg.textContent = 'Email invalide.'; return;
  }
  try {
    await setDoc(doc(db, 'invitations', email), {
      role: 'club_admin',
      club_id: String(clubActif.id),
      club_name: clubActif.name,
      team_id: null,
      status: 'pending',
      created_by: auth.currentUser.uid,
      created_at: serverTimestamp(),
    });

    await sendSignInLinkToEmail(auth, email, {
      url: SITE_URL_CONNEXION,
      handleCodeInApp: true,
    });

    $msg.className = 'msg ok';
    $msg.textContent = `✅ Email d'invitation envoyé automatiquement à ${email}.`;
    await chargerInvitations();
  } catch (e) {
    $msg.className = 'msg err';
    $msg.textContent = "Erreur : " + e.message;
  }
}

async function chargerMembres() {
  const snap = await getDocs(collection(db, 'users'));
  const $corps = document.getElementById('corps-membres');
  const LABEL_ROLE = { super_admin: 'Super admin', club_admin: 'Admin club', coach: 'Coach', player: 'Joueur', parent: 'Parent' };

  const membres = snap.docs
    .map(d => ({ uid: d.id, ...d.data() }))
    .filter(m => m.role !== 'super_admin');

  if (membres.length === 0) {
    $corps.innerHTML = '<p class="vide">Aucun membre pour le moment.</p>';
    return;
  }

  $corps.innerHTML = membres.map(m => `
    <div class="rangee">
      ${avatarHtml(m.photo_url, nomAffichage(m), 38)}
      <div>
        <div class="nom">${nomAffichage(m)}</div>
        <div class="sous-texte">${m.email} · ${LABEL_ROLE[m.role] || m.role}${m.club_name ? ' · ' + m.club_name : ''}</div>
      </div>
      <div class="action"><button class="btn-ghost" data-uid="${m.uid}">Retirer l'accès</button></div>
    </div>
  `).join('');

  $corps.querySelectorAll('[data-uid]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm("Retirer l'accès de ce membre ? (son compte de connexion reste actif, mais il perd tout accès à l'espace club)")) return;
      await deleteDoc(doc(db, 'users', btn.dataset.uid));
      await chargerMembres();
      await chargerAdminsExistants();
    });
  });
}

async function chargerInvitations() {
  const snap = await getDocs(collection(db, 'invitations'));
  const $corps = document.getElementById('corps-invitations');
  if (snap.empty) {
    $corps.innerHTML = '<p class="vide">Aucune invitation pour le moment.</p>';
    return;
  }
  const LABEL_ROLE = { super_admin: 'Super admin', club_admin: 'Admin club', coach: 'Coach', player: 'Joueur', parent: 'Parent' };
  $corps.innerHTML = [...snap.docs]
    .sort((a, b) => (b.data().created_at?.seconds || 0) - (a.data().created_at?.seconds || 0))
    .map(d => {
      const inv = d.data();
      return `
        <div class="rangee">
          <div>
            <div class="nom">${d.id}</div>
            <div class="sous-texte">${LABEL_ROLE[inv.role] || inv.role}${inv.club_name ? ' · ' + inv.club_name : ''}</div>
          </div>
          <div class="action"><span class="badge ${inv.status === 'used' ? 'badge-success' : 'badge-warning'}">${inv.status === 'used' ? 'Utilisée' : 'En attente'}</span></div>
        </div>
      `;
    }).join('');
}
</script>

</body>
</html>
