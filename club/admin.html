<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Super Admin — Espace Club</title>
<style>
  :root { --primary: #0b5cab; --bg: #f2f4f8; --card: #fff; --text: #16202e; --muted: #64748b; --border: #e6e9ef; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
  .wrap { max-width: 640px; margin: auto; }
  a.retour { color: var(--muted); font-size: 13px; text-decoration: none; }
  h1 { font-size: 19px; margin: 10px 0 16px; }
  .carte { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  input[type="text"], input[type="email"] {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); font-size: 15px;
  }
  .liste-clubs { max-height: 260px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; }
  .item-club { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; }
  .item-club:last-child { border-bottom: none; }
  .item-club:hover { background: var(--bg); }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
  .badge.oui { background: #e8f6ee; color: #1f9d55; }
  .badge.non { background: #f1f3f7; color: var(--muted); }
  .club-selectionne { background: #eaf1fc; border: 1px solid var(--primary); border-radius: 10px; padding: 12px; margin-top: 12px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
  button.principal {
    margin-top: 14px; padding: 11px 18px; background: var(--primary); color: white; border: none;
    border-radius: 9px; font-weight: 700; font-size: 14.5px; cursor: pointer;
  }
  button.principal:disabled { background: #b7c3d6; }
  .msg { font-size: 13px; margin-top: 10px; padding: 9px 12px; border-radius: 8px; display: none; }
  .msg.ok { background: #e8f6ee; color: #1f9d55; display: block; }
  .msg.err { background: #fdecea; color: #b3261e; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .statut { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .statut.pending { background: #fff4e5; color: #b45309; }
  .statut.used { background: #e8f6ee; color: #1f9d55; }
</style>
</head>
<body>
<div class="wrap">
  <a class="retour" href="./dashboard.html">← Retour au tableau de bord</a>
  <h1>🛠️ Console Super Admin</h1>

  <div class="carte">
    <strong>Assigner un administrateur à un club</strong>
    <p style="color:var(--muted); font-size:13px;">Recherche un club du Hainaut (données déjà connues du site) puis invite son administrateur.</p>
    <input type="text" id="recherche-club" placeholder="Rechercher un club...">
    <div class="liste-clubs" id="liste-clubs"></div>

    <div id="club-selectionne" style="display:none;"></div>
  </div>

  <div class="carte">
    <strong>Invitations envoyées</strong>
    <table id="table-invitations">
      <thead><tr><th>Email</th><th>Rôle</th><th>Statut</th></tr></thead>
      <tbody id="corps-invitations"><tr><td colspan="3" style="color:var(--muted);">Chargement…</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const SITE_URL_CONNEXION = "https://qtheun27.github.io/basket-awbb/club/finaliser-connexion.html";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let tousLesClubs = [];
let adminsParClub = {};
let clubActif = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'super_admin') {
    window.location.href = './dashboard.html';
    return;
  }
  await chargerClubsAwbb();
  await chargerAdminsExistants();
  await chargerInvitations();
});

async function chargerClubsAwbb() {
  const res = await fetch('../data.json?t=' + Date.now());
  const donnees = await res.json();
  tousLesClubs = donnees.clubs || [];
  afficherListeClubs(tousLesClubs);
}

async function chargerAdminsExistants() {
  const q = query(collection(db, 'users'), where('role', '==', 'club_admin'));
  const snap = await getDocs(q);
  adminsParClub = {};
  snap.forEach(d => { adminsParClub[d.data().club_id] = d.data().email; });
}

function afficherListeClubs(clubs) {
  const $liste = document.getElementById('liste-clubs');
  $liste.innerHTML = clubs.slice(0, 50).map(c => {
    const aUnAdmin = !!adminsParClub[String(c.id)];
    return `
      <div class="item-club" data-id="${c.id}" data-nom="${(c.name || '').replace(/"/g, '&quot;')}">
        <span>${c.name}</span>
        <span class="badge ${aUnAdmin ? 'oui' : 'non'}">${aUnAdmin ? 'Admin ✓' : 'Sans admin'}</span>
      </div>
    `;
  }).join('') || '<div style="padding:12px;color:var(--muted);">Aucun club trouvé.</div>';

  $liste.querySelectorAll('.item-club').forEach(el => {
    el.addEventListener('click', () => selectionnerClub(el.dataset.id, el.dataset.nom));
  });
}

document.getElementById('recherche-club').addEventListener('input', (e) => {
  const texte = e.target.value.trim().toLowerCase();
  const filtres = texte
    ? tousLesClubs.filter(c => (c.name || '').toLowerCase().includes(texte))
    : tousLesClubs;
  afficherListeClubs(filtres);
});

function selectionnerClub(clubId, nomClub) {
  clubActif = { id: clubId, name: nomClub };
  const adminActuel = adminsParClub[String(clubId)];
  const $zone = document.getElementById('club-selectionne');
  $zone.style.display = 'block';
  $zone.className = 'club-selectionne';
  $zone.innerHTML = `
    <strong>${nomClub}</strong>
    ${adminActuel
      ? `<p style="font-size:13px;color:var(--muted);margin-top:6px;">Administrateur actuel : ${adminActuel}</p>`
      : `
        <label for="email-admin">Email du futur administrateur de ce club</label>
        <input type="email" id="email-admin" placeholder="admin@club.be">
        <button class="principal" id="btn-inviter">Envoyer l'invitation</button>
        <div class="msg" id="msg-invite"></div>
      `}
  `;
  if (!adminActuel) {
    document.getElementById('btn-inviter').addEventListener('click', envoyerInvitationAdmin);
  }
}

async function envoyerInvitationAdmin() {
  const email = document.getElementById('email-admin').value.trim().toLowerCase();
  const $msg = document.getElementById('msg-invite');
  if (!email || !email.includes('@')) {
    $msg.className = 'msg err'; $msg.textContent = 'Email invalide.'; return;
  }
  try {
    await setDoc(doc(db, 'invitations', email), {
      role: 'club_admin',
      club_id: String(clubActif.id),
      club_name: clubActif.name,
      team_id: null,
      status: 'pending',
      created_by: auth.currentUser.uid,
      created_at: serverTimestamp(),
    });

    await sendSignInLinkToEmail(auth, email, {
      url: SITE_URL_CONNEXION,
      handleCodeInApp: true,
    });

    $msg.className = 'msg ok';
    $msg.textContent = `✅ Email d'invitation envoyé automatiquement à ${email}. Il n'a qu'à cliquer le lien reçu.`;
    await chargerInvitations();
  } catch (e) {
    $msg.className = 'msg err';
    $msg.textContent = "Erreur : " + e.message;
  }
}

async function chargerInvitations() {
  const snap = await getDocs(collection(db, 'invitations'));
  const $corps = document.getElementById('corps-invitations');
  if (snap.empty) {
    $corps.innerHTML = '<tr><td colspan="3" style="color:var(--muted);">Aucune invitation pour le moment.</td></tr>';
    return;
  }
  const LABEL_ROLE = { super_admin: 'Super admin', club_admin: 'Admin club', coach: 'Coach', player: 'Joueur', parent: 'Parent' };
  $corps.innerHTML = [...snap.docs]
    .sort((a, b) => (b.data().created_at?.seconds || 0) - (a.data().created_at?.seconds || 0))
    .map(d => {
      const inv = d.data();
      return `
        <tr>
          <td>${d.id}</td>
          <td>${LABEL_ROLE[inv.role] || inv.role}${inv.club_name ? ' · ' + inv.club_name : ''}</td>
          <td><span class="statut ${inv.status}">${inv.status === 'used' ? 'Utilisée' : 'En attente'}</span></td>
        </tr>
      `;
    }).join('');
}
</script>
</body>
</html>
