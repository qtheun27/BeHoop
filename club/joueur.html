<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon équipe — BeHoop</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .entete-profil { display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>
<div class="container" style="padding-top:16px;">
  <div class="carte" id="carte-joueur-profil">
    <div class="skel" style="height:50px;"></div>
  </div>

  <div class="carte">
    <div class="carte-titre">🏀 Mes statistiques</div>
    <div id="zone-stats-joueur"><p class="vide">Chargement…</p></div>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml } from "./avatar.js";
import { rendreNav, rendreNavImmediat, rendreEntete } from "./nav.js";

rendreEntete('Mon équipe');
rendreNavImmediat('espace');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const userSnap = await getDoc(doc(db, 'users', user.uid));
  if (!userSnap.exists()) { window.location.href = './index.html'; return; }
  const userProfil = userSnap.data();

  rendreNav(userProfil.role, 'espace');

  const playerSnap = await getDoc(doc(db, 'players', user.uid));
  const joueur = playerSnap.exists() ? playerSnap.data() : {};

  const res = await fetch('../data.json?t=' + Date.now());
  const donnees = await res.json();
  const club = (donnees.clubs || []).find(c => String(c.id) === String(userProfil.club_id));

  // Récupération de l'équipe du joueur
  const equipe = (club && club.teams) ? club.teams.find(t => String(t.id) === String(joueur.team_id)) : null;
  const nomEquipe = equipe ? (equipe.category || equipe.name) : 'Équipe non définie';

  const clubLogo = (club && club.logo_url)
    ? `<img src="${club.logo_url}" alt="${club.name}" style="width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;">`
    : avatarHtml(null, club ? club.name : 'Mon Club', 48);

  // Nom du club en grand, nom de l'équipe en sous-titre
  document.getElementById('carte-joueur-profil').innerHTML = `
    <div class="entete-profil">
      ${clubLogo}
      <div>
        <div class="nom" style="font-weight:800;font-size:16px;">${club ? club.name : 'Mon Club'}</div>
        <div class="meta" style="font-size:12.5px;color:var(--text-muted);">${nomEquipe}</div>
      </div>
    </div>
  `;

  await chargerStatsJoueur(user.uid);
});

async function chargerStatsJoueur(uid) {
  const $zone = document.getElementById('zone-stats-joueur');
  const q = query(collection(db, 'player_stats'), where('player_id', '==', uid));
  const snap = await getDocs(q);

  if (snap.empty) {
    $zone.innerHTML = '<p class="vide">Aucune statistique enregistrée pour le moment.</p>';
    return;
  }

  const stats = snap.docs.map(d => d.data());
  const total = stats.length;
  const pts = stats.reduce((acc, s) => acc + (s.points || 0), 0);
  const reb = stats.reduce((acc, s) => acc + (s.rebonds || 0), 0);
  const pas = stats.reduce((acc, s) => acc + (s.passes || 0), 0);

  $zone.innerHTML = `
    <div style="display:flex;justify-content:space-around;text-align:center;padding:10px 0;">
      <div><div style="font-size:22px;font-weight:800;color:var(--primary);">${(pts/total).toFixed(1)}</div><div style="font-size:11px;color:var(--text-muted);">PTS/M</div></div>
      <div><div style="font-size:22px;font-weight:800;color:var(--primary);">${(reb/total).toFixed(1)}</div><div style="font-size:11px;color:var(--text-muted);">REB/M</div></div>
      <div><div style="font-size:22px;font-weight:800;color:var(--primary);">${(pas/total).toFixed(1)}</div><div style="font-size:11px;color:var(--text-muted);">PAS/M</div></div>
    </div>
  `;
}
</script>
</body>
</html>
