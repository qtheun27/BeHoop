<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeHoop">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<title>Mon équipe — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .entrainement { border-bottom: 1px solid var(--border-soft); padding: 10px 0; font-size: 13.5px; }
  .entrainement:last-child { border-bottom: none; }
  .lieu { color: var(--text-muted); font-size: 12px; }
  table.historique { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.historique th, table.historique td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--border-soft); }
  table.historique td:first-child, table.historique th:first-child { text-align: left; }
  .entete-joueur { display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>
<div class="app-bar">
  <a class="retour cache-si-nav-basse" href="./dashboard.html">←</a>
  <span class="titre" id="titre">🏀 Mon équipe</span>
</div>
<div class="container" style="padding-top:16px;">
  <div class="carte" id="carte-entete" style="display:none;"></div>
  <div class="carte">
    <div class="carte-titre">Prochains entraînements</div>
    <div id="liste-entrainements"><p class="vide">Chargement…</p></div>
  </div>
  <div class="carte">
    <div class="carte-titre">Mes statistiques</div>
    <div id="mes-stats"><p class="vide">Chargement…</p></div>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { rendreNav, rendreNavImmediat } from "./nav.js";

rendreNavImmediat('espace');
import { afficherVueJoueur } from "./joueur-vue.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'player') { window.location.href = './dashboard.html'; return; }
  rendreNav('player', 'espace');


  // Pour un joueur auto-géré, l'id de sa fiche players/{id} est son propre uid.
  await afficherVueJoueur(db, user.uid, {
    entete: document.getElementById('carte-entete'),
    entrainements: document.getElementById('liste-entrainements'),
    stats: document.getElementById('mes-stats'),
    titre: document.getElementById('titre'),
  });
});
</script>

</body>
</html>
