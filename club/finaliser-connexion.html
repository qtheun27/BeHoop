<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeHoop">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<title>Connexion — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  body { display: flex; align-items: center; min-height: 100vh; padding: 24px 16px; }
</style>
</head>
<body>
<div class="container-sm" style="width:100%;">
  <div class="carte" id="zone" style="text-align:center;">
    <p class="vide">Connexion en cours…</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, isSignInWithEmailLink, signInWithEmailLink, updatePassword
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { reclamerInvitation, lireInvitationEnAttente } from "./invite-logic.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $zone = document.getElementById('zone');

async function finaliser(email) {
  $zone.innerHTML = '<p class="vide">Connexion en cours…</p>';
  try {
    const { user } = await signInWithEmailLink(auth, email, window.location.href);
    window.localStorage.removeItem('emailPourConnexion');

    demanderCreationMotDePasse(user);

  } catch (e) {
    $zone.innerHTML = `
      <p class="vide">Impossible de finaliser la connexion.</p>
      <div class="msg err">${e.message}</div>
      <p class="vide" style="margin-top:14px;"><a href="./index.html">Retour à la page de connexion</a></p>
    `;
  }
}

function demanderCreationMotDePasse(user) {
  $zone.innerHTML = `
    <div class="carte-titre" style="justify-content:center;">🔐 Choisissez votre mot de passe</div>
    <p class="carte-desc">Définissez le mot de passe qui vous permettra de vous connecter directement à l'Espace Club.</p>
    <input type="password" id="mdp1" placeholder="Mot de passe (6 caractères min.)" style="margin-top:12px;">
    <input type="password" id="mdp2" placeholder="Confirmer le mot de passe" style="margin-top:8px;">
    <button class="btn btn-primary btn-block" id="btn-save-pass" style="margin-top:14px;">Valider et continuer</button>
    <div class="msg" id="msg-pass"></div>
  `;

  document.getElementById('btn-save-pass').addEventListener('click', async () => {
    const p1 = document.getElementById('mdp1').value;
    const p2 = document.getElementById('mdp2').value;
    const $msg = document.getElementById('msg-pass');

    if (p1.length < 6) { $msg.className = 'msg err'; $msg.textContent = 'Le mot de passe doit faire au moins 6 caractères.'; return; }
    if (p1 !== p2) { $msg.className = 'msg err'; $msg.textContent = 'Les mots de passe ne correspondent pas.'; return; }

    try {
      await updatePassword(user, p1);
      
      const profilRef = doc(db, 'users', user.uid);
      const profilSnap = await getDoc(profilRef);
      if (!profilSnap.exists()) {
        const invitation = await lireInvitationEnAttente(db, user);
        if (invitation && invitation.role === 'player') {
          window.location.href = './choix-role.html';
          return;
        }
        await reclamerInvitation(db, user);
      }
      window.location.href = './dashboard.html';
    } catch (err) {
      $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + err.message;
    }
  });
}

if (!isSignInWithEmailLink(auth, window.location.href)) {
  $zone.innerHTML = `
    <p class="vide">Ce lien n'est plus valide ou a déjà été utilisé.</p>
    <p class="vide" style="margin-top:10px;"><a href="./index.html">Retour à la page de connexion</a></p>
  `;
} else {
  let email = window.localStorage.getItem('emailPourConnexion');
  if (email) {
    finaliser(email);
  } else {
    $zone.innerHTML = `
      <p><strong>Confirmez votre email</strong></p>
      <p class="vide">Pour finaliser la connexion en toute sécurité.</p>
      <input type="email" id="email-confirm" placeholder="votre@email.com" style="margin-top:12px;">
      <button class="btn btn-primary btn-block" id="btn-confirm" style="margin-top:14px;">Continuer</button>
    `;
    document.getElementById('btn-confirm').addEventListener('click', () => {
      const val = document.getElementById('email-confirm').value.trim();
      if (val) finaliser(val);
    });
  }
}
</script>
</body>
</html>
