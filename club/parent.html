<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mes enfants — BeHoop</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container" style="padding-top:16px;">
  <div class="carte">
    <div class="carte-titre">👨‍👩‍👧 Mes enfants</div>
    <div class="carte-desc">Consultez l'équipe et le suivi de vos enfants rattachés par l'administration du club.</div>
    <div id="liste-enfants"><p class="vide">Chargement…</p></div>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml, nomAffichage } from "./avatar.js";
import { rendreNav, rendreNavImmediat, rendreEntete } from "./nav.js";

rendreEntete('Mes enfants');
rendreNavImmediat('espace');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'parent') { window.location.href = './dashboard.html'; return; }
  
  rendreNav('parent', 'espace');
  await chargerEnfants(snap.data());
});

async function chargerEnfants(profilParent) {
  const $liste = document.getElementById('liste-enfants');
  const ids = profilParent.children_player_ids || [];

  if (ids.length === 0) {
    $liste.innerHTML = '<p class="vide">Aucun enfant n\'est actuellement associé à votre compte. Contactez l\'administrateur de votre club pour faire le rapprochement.</p>';
    return;
  }

  let html = '';
  for (const pid of ids) {
    const pSnap = await getDoc(doc(db, 'players', pid));
    if (!pSnap.exists()) continue;
    const p = pSnap.data();
    html += `
      <div class="rangee" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft);">
        <div style="display:flex;align-items:center;gap:10px;">
          ${avatarHtml(p.photo_url, nomAffichage(p), 40)}
          <div>
            <div style="font-weight:700;">${nomAffichage(p)}</div>
            <div style="font-size:12px;color:var(--text-muted);">${p.position || 'Joueur'}</div>
          </div>
        </div>
      </div>
    `;
  }
  $liste.innerHTML = html || '<p class="vide">Aucun enfant trouvé.</p>';
}
</script>
</body>
</html>
