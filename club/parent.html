<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mes enfants — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .entete-enfant { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; cursor: pointer; }
  .entete-joueur { display: flex; align-items: center; gap: 12px; }
  h3.section { font-size: 12px; margin: 16px 0 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .entrainement { border-bottom: 1px solid var(--border-soft); padding: 9px 0; font-size: 13.5px; }
  .entrainement:last-child { border-bottom: none; }
  .lieu { color: var(--text-muted); font-size: 12px; }
  table.historique { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.historique th, table.historique td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--border-soft); }
  table.historique td:first-child, table.historique th:first-child { text-align: left; }
  .carte-enfant { cursor: pointer; }
  .chevron-enfant { margin-left: auto; color: var(--text-muted); }
</style>
</head>
<body>
<div class="app-bar">
  <a class="retour" href="./dashboard.html">←</a>
  <span class="titre">👨‍👩‍👧 Mes enfants</span>
</div>
<div class="container" style="padding-top:16px;">
  <div id="liste-enfants"><div class="carte"><p class="vide">Chargement…</p></div></div>
  <div id="vue-enfant"></div>

  <div class="carte">
    <div class="carte-titre">Ajouter un enfant</div>
    <div class="carte-desc">Ton enfant n'a pas besoin de sa propre adresse email — tu gères son compte depuis le tien.</div>
    <div class="grille-2">
      <input type="text" id="enfant-prenom" placeholder="Prénom">
      <input type="text" id="enfant-nom" placeholder="Nom">
    </div>
    <label class="champ-label">Équipe (optionnel, modifiable plus tard par l'admin)</label>
    <select id="enfant-equipe"><option value="">— Choisir plus tard —</option></select>
    <button class="btn btn-primary" style="margin-top:14px;" id="btn-ajouter-enfant">Ajouter</button>
    <div class="msg" id="msg-ajout"></div>
  </div>
</div>
<footer class="pied">Basket Hainaut — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, addDoc, updateDoc, collection, arrayUnion, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml, nomAffichage } from "./avatar.js";
import { afficherVueJoueur } from "./joueur-vue.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let monProfil = null;
let equipesDuClub = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'parent') { window.location.href = './dashboard.html'; return; }
  monProfil = snap.data();

  if (monProfil.club_id) {
    const res = await fetch('../data.json?t=' + Date.now());
    const donnees = await res.json();
    const club = (donnees.clubs || []).find(c => String(c.id) === String(monProfil.club_id));
    equipesDuClub = club ? (club.teams || []) : [];
    document.getElementById('enfant-equipe').innerHTML = '<option value="">— Choisir plus tard —</option>' +
      equipesDuClub.map(eq => `<option value="${eq.id}">${eq.category || eq.name}</option>`).join('');
  }

  await chargerEnfants();
});

async function chargerEnfants() {
  const $liste = document.getElementById('liste-enfants');
  const ids = monProfil.children_player_ids || [];
  if (ids.length === 0) {
    $liste.innerHTML = '<div class="carte"><p class="vide">Aucun enfant ajouté pour le moment — utilise le formulaire ci-dessous.</p></div>';
    return;
  }

  const enfants = [];
  for (const id of ids) {
    const s = await getDoc(doc(db, 'players', id));
    if (s.exists()) enfants.push({ id, ...s.data() });
  }

  const nomEquipe = (tid) => {
    const eq = equipesDuClub.find(e => String(e.id) === String(tid));
    return eq ? (eq.category || eq.name) : 'Aucune équipe assignée';
  };

  $liste.innerHTML = `
    <div class="carte">
      <div class="carte-titre">Mes enfants</div>
      <div class="carte-desc">Touche un enfant pour voir son équipe, ses entraînements et ses stats.</div>
      ${enfants.map(e => `
        <div class="rangee carte-enfant" data-id="${e.id}">
          ${avatarHtml(e.photo_url, nomAffichage(e), 40)}
          <div>
            <div class="nom">${nomAffichage(e)}</div>
            <div class="sous-texte">${nomEquipe(e.team_id)}</div>
          </div>
          <span class="chevron-enfant">›</span>
        </div>
      `).join('')}
    </div>
  `;

  $liste.querySelectorAll('.carte-enfant').forEach(el => {
    el.addEventListener('click', () => afficherEnfant(el.dataset.id));
  });

  if (enfants.length === 1) afficherEnfant(enfants[0].id);
}

async function afficherEnfant(playerId) {
  const $vue = document.getElementById('vue-enfant');
  $vue.innerHTML = `
    <div class="carte" id="entete-enfant-actif" style="display:none;"></div>
    <div class="carte">
      <h3 class="section">Prochains entraînements</h3>
      <div id="entrainements-enfant-actif"><p class="vide">Chargement…</p></div>
      <h3 class="section">Statistiques</h3>
      <div id="stats-enfant-actif"><p class="vide">Chargement…</p></div>
    </div>
  `;
  await afficherVueJoueur(db, playerId, {
    entete: document.getElementById('entete-enfant-actif'),
    entrainements: document.getElementById('entrainements-enfant-actif'),
    stats: document.getElementById('stats-enfant-actif'),
    titre: null,
  });
  $vue.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('btn-ajouter-enfant').addEventListener('click', async () => {
  const prenom = document.getElementById('enfant-prenom').value.trim();
  const nom = document.getElementById('enfant-nom').value.trim();
  const teamId = document.getElementById('enfant-equipe').value;
  const $msg = document.getElementById('msg-ajout');
  if (!prenom) { $msg.className = 'msg err'; $msg.textContent = 'Le prénom est obligatoire.'; return; }

  try {
    const nouvelEnfant = await addDoc(collection(db, 'players'), {
      club_id: monProfil.club_id || null,
      team_id: teamId ? String(teamId) : null,
      account_uid: '',
      parent_uids: [auth.currentUser.uid],
      prenom, nom,
      created_at: serverTimestamp(),
    });
    await updateDoc(doc(db, 'users', auth.currentUser.uid), {
      children_player_ids: arrayUnion(nouvelEnfant.id),
    });
    monProfil.children_player_ids = [...(monProfil.children_player_ids || []), nouvelEnfant.id];

    $msg.className = 'msg ok'; $msg.textContent = '✅ Enfant ajouté.';
    document.getElementById('enfant-prenom').value = '';
    document.getElementById('enfant-nom').value = '';
    await chargerEnfants();
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
});
</script>
</body>
</html>
