<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mes enfants — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .entete-enfant { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  h3.section { font-size: 12px; margin: 16px 0 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .entrainement { border-bottom: 1px solid var(--border-soft); padding: 9px 0; font-size: 13.5px; }
  .entrainement:last-child { border-bottom: none; }
  .lieu { color: var(--text-muted); font-size: 12px; }
  table.historique { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.historique th, table.historique td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--border-soft); }
  table.historique td:first-child, table.historique th:first-child { text-align: left; }
</style>
</head>
<body>
<div class="app-bar">
  <a class="retour" href="./dashboard.html">←</a>
  <span class="titre">👨‍👩‍👧 Mes enfants</span>
</div>
<div class="container" style="padding-top:16px;">
  <div id="contenu"><div class="carte"><p class="vide">Chargement…</p></div></div>
</div>
<footer class="pied">Basket Hainaut — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml, nomAffichage } from "./avatar.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function formatDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('fr-BE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'parent') { window.location.href = './dashboard.html'; return; }
  const profil = snap.data();
  const $contenu = document.getElementById('contenu');

  if (!profil.children_uids || profil.children_uids.length === 0) {
    $contenu.innerHTML = '<div class="carte"><p class="vide">Aucun enfant lié à ton compte pour le moment. Contacte l\'administrateur de ton club.</p></div>';
    return;
  }

  const res = await fetch('../data.json?t=' + Date.now());
  const donnees = await res.json();
  const aujourdhui = new Date().toISOString().slice(0, 10);

  let html = '';
  for (const childUid of profil.children_uids) {
    const childSnap = await getDoc(doc(db, 'users', childUid));
    if (!childSnap.exists()) continue;
    const enfant = childSnap.data();

    const club = (donnees.clubs || []).find(c => String(c.id) === String(enfant.club_id));
    const equipe = club ? (club.teams || []).find(e => String(e.id) === String(enfant.team_id)) : null;

    const qEnt = query(collection(db, 'trainings'), where('team_id', '==', String(enfant.team_id || '')));
    const snapEnt = enfant.team_id ? await getDocs(qEnt) : { docs: [] };
    const trainings = snapEnt.docs.map(d => d.data()).filter(t => t.date >= aujourdhui).sort((a, b) => a.date.localeCompare(b.date));

    const qStats = query(collection(db, 'player_stats'), where('player_uid', '==', childUid));
    const snapStats = await getDocs(qStats);
    const lignes = snapStats.docs.map(d => d.data()).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    html += `
      <div class="carte">
        <div class="entete-enfant">
          ${avatarHtml(enfant.photo_url, nomAffichage(enfant), 48)}
          <div>
            <strong>${nomAffichage(enfant)}</strong>
            <div class="vide" style="margin-top:2px;">${equipe ? (equipe.category || equipe.name) : 'Aucune équipe assignée'}</div>
          </div>
        </div>

        <h3 class="section">Prochains entraînements</h3>
        ${trainings.length
          ? trainings.map(t => `<div class="entrainement">${formatDate(t.date)} · ${t.start_time || ''}<div class="lieu">${t.location || ''}</div></div>`).join('')
          : '<p class="vide">Aucun entraînement à venir.</p>'}

        <h3 class="section">Statistiques</h3>
        ${lignes.length ? `
          <table class="historique">
            <thead><tr><th>Date</th><th>Pts</th><th>Reb</th><th>Pas</th><th>Min</th></tr></thead>
            <tbody>${lignes.map(l => `<tr><td>${l.date}</td><td>${l.points ?? 0}</td><td>${l.rebonds ?? 0}</td><td>${l.passes ?? 0}</td><td>${l.minutes ?? 0}</td></tr>`).join('')}</tbody>
          </table>
        ` : '<p class="vide">Aucune statistique enregistrée.</p>'}
      </div>
    `;
  }
  $contenu.innerHTML = html || '<div class="carte"><p class="vide">Aucune donnée disponible.</p></div>';
});
</script>
</body>
</html>
