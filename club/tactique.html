<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- Optimisations PWA iOS / Safari plein écran -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeHoop">
<meta name="theme-color" content="#0d1117">

<title>Tableau Tactique & Exercices — BeHoop</title>
<link rel="stylesheet" href="./styles.css">
<style>
  :root {
    --court-bg: #1a2332;
    --offense: #ff6b00;
    --defense: #0088ff;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0; 
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); 
    color: var(--text);
  }

  .toolbar-board {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center;
  }

  /* Style pour les boutons d'outils actifs */
  .toolbar-board .btn.actif, 
  .player-bar .btn.actif {
    background: #0b5cab !important;
    color: #ffffff !important;
    border-color: #0b5cab !important;
    font-weight: 800;
    box-shadow: 0 0 0 2px rgba(11, 92, 171, 0.4);
  }

  /* Seul le terrain bloque le scroll pour gérer le glisser-déposer */
  #board-container {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    width: 100%; max-width: 500px; aspect-ratio: 500 / 470; background: var(--court-bg);
    border-radius: var(--radius-md); border: 2px solid var(--border); overflow: hidden; position: relative;
    margin: 0 auto; box-shadow: var(--shadow-md);
  }
  
  svg { width: 100%; height: 100%; display: block; }
  
  .token { cursor: move; }
  .token text { font-size: 13px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  .player-bar {
    width: 100%; max-width: 500px; margin: 10px auto 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .player-controls { display: flex; justify-content: space-between; align-items: center; }
  .step-info { font-size: 13px; font-weight: 700; color: var(--text-muted); }
  
  .trajectory-line { stroke-dasharray: 4; animation: dash 1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -8; } }

  .item-schema {
    display: flex; justify-content: space-between; align-items: center; padding: 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px;
    background: var(--surface); cursor: pointer; transition: background 0.2s;
  }
  .item-schema:hover { background: var(--surface-2); }
  .item-schema .titre-schema { font-weight: 700; font-size: 14px; }
  .item-schema .meta-schema { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>


<div class="container" style="padding-top:14px;">

  <!-- Carte Sélecteur de schémas enregistrés -->
  <div class="carte">
    <div class="carte-titre">Bibliothèque de l'équipe</div>
    <div class="puces" style="margin-bottom:10px;">
      <button class="puce actif" id="flt-tous">Tous</button>
      <button class="puce" id="flt-tactique">🏀 Tactiques</button>
      <button class="puce" id="flt-exercice">🏋️ Exercices</button>
    </div>
    <div id="liste-schemas"><p class="vide">Chargement des schémas…</p></div>
  </div>

  <!-- Carte Terrain / Animation -->
  <div class="carte" style="text-align:center;">
    <div class="toolbar-board">
      <button id="btn-half" class="btn btn-secondary btn-sm actif" onclick="setCourt('half')">Demi-terrain</button>
      <button id="btn-full" class="btn btn-secondary btn-sm" onclick="setCourt('full')">Terrain complet</button>
      <button id="btn-traj" class="btn btn-secondary btn-sm actif" onclick="toggleTrajectories()">🛣️ Trajectoires</button>
      <button class="btn btn-secondary btn-sm" onclick="resetAll()">🔄 Réinit</button>
    </div>

    <div id="board-container">
      <svg id="court" viewBox="0 0 500 470">
        <defs>
          <marker id="arrow-offense" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--offense)" />
          </marker>
          <marker id="arrow-defense" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--defense)" />
          </marker>
          <marker id="arrow-ball" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff" />
          </marker>
        </defs>
        <g id="court-lines"></g>
        <g id="trajectories"></g>
        <g id="tokens"></g>
      </svg>
    </div>

    <!-- Barre d'Animation / Étapes -->
    <div class="player-bar">
      <div class="player-controls">
        <div style="display:flex; gap:6px;">
          <button id="btn-play" class="btn btn-primary btn-sm" onclick="togglePlay()">▶️ Jouer</button>
          <button class="btn btn-secondary btn-sm" onclick="prevStep()">⏮️ Préc.</button>
          <button class="btn btn-secondary btn-sm" onclick="nextStep()">Suiv. ⏭️</button>
        </div>
        <span class="step-info" id="step-counter">Étape 1 / 1</span>
      </div>

      <div class="coach-only" style="border-top: 1px solid var(--border); padding-top: 8px;">
        <label class="champ-label" style="margin-top:0;">Action du ballon</label>
        <div style="display:flex; gap:5px; flex-wrap:wrap;">
          <button type="button" class="btn-ghost btn-geste" data-geste="chest">Chest pass</button>
          <button type="button" class="btn-ghost btn-geste" data-geste="bounce">Bounce pass</button>
          <button type="button" class="btn-ghost btn-geste" data-geste="handoff">Hand-off</button>
          <button type="button" class="btn-ghost btn-geste" data-geste="shoot">Shoot</button>
          <button type="button" class="btn-ghost btn-geste" data-geste="layup">Lay-up</button>
          <button type="button" class="btn-ghost btn-geste" data-geste="power_layup">Power Lay-up</button>
        </div>
        <p class="vide" id="aide-geste" style="font-size:11.5px; margin-top:6px;">
          Choisis une action, puis touche le destinataire (passe) ou le panier (tir).
        </p>
      </div>

      <div class="coach-only" style="display:flex; gap:10px; align-items:center; border-top: 1px solid var(--border); padding-top: 8px; flex-wrap:wrap;">
        <label style="font-size:12px; display:flex; align-items:center; gap:5px;">
          Attaque
          <select id="nb-offense" style="background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:5px; border-radius:6px; font-size:12px;">
            <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
          </select>
        </label>
        <label style="font-size:12px; display:flex; align-items:center; gap:5px;">
          Défense
          <select id="nb-defense" style="background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:5px; border-radius:6px; font-size:12px;">
            <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
          </select>
        </label>
      </div>

      <div class="coach-only" style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid var(--border); padding-top: 8px;">
        <div style="display:flex; gap:6px;">
          <button class="btn btn-secondary btn-sm" onclick="addStep()">➕ Étape</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteStep()">🗑️ Suppr</button>
        </div>
        <select id="speed-select" onchange="window.speed = parseFloat(this.value)" style="background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:5px; border-radius:6px; font-size:12px;">
          <option value="1000">Vitesse : Normale</option>
          <option value="1500">Vitesse : Lente</option>
          <option value="600">Vitesse : Rapide</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Formulaire d'enregistrement -->
  <div class="carte coach-only" id="form-sauvegarde">
    <div class="carte-titre" id="form-titre">Enregistrer ce schéma</div>
    
    <label class="champ-label">Titre du schéma</label>
    <input type="text" id="schema-titre" placeholder="ex: Pick & Roll Tête de raquette / Exercice 3c3">

    <label class="champ-label">Type de contenu</label>
    <select id="schema-type">
      <option value="tactique">🏀 Tactique / Phase de jeu</option>
      <option value="exercice">🏋️ Exercice / Entraînement</option>
    </select>

    <label class="champ-label">Équipe concernée</label>
    <select id="schema-equipe">
      <option value="all">Toutes mes équipes</option>
    </select>

    <label class="champ-label">Consignes / Notes (optionnel)</label>
    <textarea id="schema-notes" rows="3" placeholder="Explications sur les déplacements, timing..."></textarea>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn btn-primary" style="flex:1;" id="btn-save-schema">Enregistrer dans l'Espace Club</button>
      <button class="btn btn-secondary" id="btn-nouveau-schema" style="display:none;" onclick="reinitialiserFormulaireCreation()">➕ Nouveau</button>
    </div>
    <div class="msg" id="msg-schema"></div>
  </div>

</div>

<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, addDoc, setDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { rendreNav, rendreNavImmediat, rendreEntete } from "./nav.js";

rendreEntete('Ardoise tactique');
rendreNavImmediat('tactique');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let monProfil = null;
let estEditeur = false;
let filtreActif = 'tous';
let schemaEnEditionId = null;
let mesSchemas = [];

let currentMode = 'half';
let activeToken = null;
let offset = { x: 0, y: 0 };
let showTrajectories = true;

// Placements de reference (jusqu'a 5 par camp) ; on prend les N premiers
// selon le nombre de joueurs choisi par le coach.
const PLACES_OFFENSE = [
  { x: 250, y: 380 }, { x: 100, y: 300 }, { x: 400, y: 300 },
  { x: 170, y: 160 }, { x: 330, y: 160 },
];
const PLACES_DEFENSE = [
  { x: 250, y: 330 }, { x: 130, y: 270 }, { x: 370, y: 270 },
  { x: 190, y: 170 }, { x: 310, y: 170 },
];

function construireEffectif(nbOffense, nbDefense) {
  const jetons = [];
  for (let i = 0; i < nbOffense; i++) {
    jetons.push({ id: 'O' + (i + 1), type: 'offense', label: String(i + 1), ...PLACES_OFFENSE[i] });
  }
  for (let i = 0; i < nbDefense; i++) {
    jetons.push({ id: 'D' + (i + 1), type: 'defense', label: 'D' + (i + 1), ...PLACES_DEFENSE[i] });
  }
  jetons.push({ id: 'BALL', type: 'ball', label: '🏀', x: 250, y: 402 });
  return jetons;
}

let nbOffense = 5, nbDefense = 5;
const initialData = construireEffectif(nbOffense, nbDefense);

let steps = [ { step: 1, tokens: JSON.parse(JSON.stringify(initialData)) } ];
let currentStep = 0;
let isPlaying = false;
let animFrame = null;
window.speed = 1000;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) { window.location.href = './index.html'; return; }
  
  monProfil = snap.data();
  rendreNav(monProfil.role, 'tactique');
  estEditeur = ['coach', 'club_admin', 'super_admin'].includes(monProfil.role);

  if (!estEditeur) {
    document.querySelectorAll('.coach-only').forEach(el => el.style.display = 'none');
  } else {
    await chargerEquipesCoach();
  }

  await chargerSchemas();
});

async function chargerEquipesCoach() {
  const $select = document.getElementById('schema-equipe');
  if (!monProfil.club_id) return;

  try {
    const res = await fetch('../data.json?t=' + Date.now());
    const donnees = await res.json();
    const club = (donnees.clubs || []).find(c => String(c.id) === String(monProfil.club_id));
    if (club && club.teams) {
      let idsAutorises = null;
      if (monProfil.role === 'coach') {
        idsAutorises = (monProfil.team_ids || []).map(String);
      } else if (monProfil.role === 'player') {
        const p = await getDoc(doc(db, 'players', auth.currentUser.uid));
        idsAutorises = p.exists() && p.data().team_id ? [String(p.data().team_id)] : [];
      } else if (monProfil.role === 'parent') {
        const ids = [];
        for (const pid of (monProfil.children_player_ids || [])) {
          const p = await getDoc(doc(db, 'players', pid));
          if (p.exists() && p.data().team_id) ids.push(String(p.data().team_id));
        }
        idsAutorises = [...new Set(ids)];
      }

      const mesEqs = idsAutorises === null
        ? club.teams
        : club.teams.filter(eq => idsAutorises.includes(String(eq.id)));
      mesEqs.forEach(eq => {
        const opt = document.createElement('option');
        opt.value = String(eq.id);
        opt.textContent = eq.category || eq.name;
        $select.appendChild(opt);
      });
    }
  } catch (e) { console.error(e); }
}

async function chargerSchemas() {
  const $liste = document.getElementById('liste-schemas');
  $liste.innerHTML = 'Chargement…';

  if (!monProfil.club_id) {
    $liste.innerHTML = '<p class="vide">Aucun club associé à ton profil.</p>';
    return;
  }

  try {
    const q = query(collection(db, 'plays'), where('club_id', '==', String(monProfil.club_id)));
    const snap = await getDocs(q);

    if (snap.empty) {
      $liste.innerHTML = '<p class="vide">Aucun schéma ou exercice enregistré pour le moment.</p>';
      mesSchemas = [];
      return;
    }

    mesSchemas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    afficherListeSchemas();
  } catch (e) {
    $liste.innerHTML = `<p class="vide">Erreur de chargement : ${e.message}</p>`;
  }
}

function afficherListeSchemas() {
  const $liste = document.getElementById('liste-schemas');
  let filtrés = mesSchemas;

  if (filtreActif !== 'tous') {
    filtrés = mesSchemas.filter(s => s.type === filtreActif);
  }

  if (filtrés.length === 0) {
    $liste.innerHTML = '<p class="vide">Aucun schéma dans cette catégorie.</p>';
    return;
  }

  $liste.innerHTML = filtrés.map(s => `
    <div class="item-schema" onclick="window.__chargerUnSchema('${s.id}')">
      <div>
        <div class="titre-schema">${s.type === 'exercice' ? '🏋️' : '🏀'} ${s.title}</div>
        <div class="meta-schema">${s.type === 'exercice' ? 'Exercice' : 'Tactique'} · ${s.steps ? s.steps.length : 1} étape(s) ${s.notes ? '· ' + s.notes.slice(0, 30) + '...' : ''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <span class="badge badge-primary">${s.courtMode === 'full' ? 'Terrain complet' : 'Demi-terrain'}</span>
        ${estEditeur ? `<button class="btn-ghost" style="padding:4px 8px;font-size:11px;" onclick="event.stopPropagation(); window.__supprimerSchema('${s.id}')">🗑️</button>` : ''}
      </div>
    </div>
  `).join('');
}

window.__chargerUnSchema = (id) => {
  const s = mesSchemas.find(x => x.id === id);
  if (!s) return;

  stopAnimation();
  schemaEnEditionId = s.id;
  currentMode = s.courtMode || 'half';
  
  let loadedSteps = s.steps || [];
  if (loadedSteps.length > 0 && Array.isArray(loadedSteps[0])) {
    steps = loadedSteps.map((arr, idx) => ({ step: idx + 1, tokens: arr }));
  } else if (loadedSteps.length > 0) {
    steps = JSON.parse(JSON.stringify(loadedSteps));
  } else {
    steps = [ { step: 1, tokens: JSON.parse(JSON.stringify(initialData)) } ];
  }

  currentStep = 0;
  setCourt(currentMode);
  updateUI();

  if (estEditeur) {
    document.getElementById('schema-titre').value = s.title || '';
    document.getElementById('schema-type').value = s.type || 'tactique';
    document.getElementById('schema-equipe').value = s.team_id || 'all';
    document.getElementById('schema-notes').value = s.notes || '';
    document.getElementById('form-titre').textContent = 'Modifier le schéma';
    document.getElementById('btn-save-schema').textContent = 'Mettre à jour';
    document.getElementById('btn-nouveau-schema').style.display = 'inline-block';
  }

  window.scrollTo({ top: document.getElementById('board-container').offsetTop - 60, behavior: 'smooth' });
};

window.reinitialiserFormulaireCreation = () => {
  stopAnimation();
  schemaEnEditionId = null;
  steps = [ { step: 1, tokens: JSON.parse(JSON.stringify(initialData)) } ];
  currentStep = 0;
  document.getElementById('schema-titre').value = '';
  document.getElementById('schema-notes').value = '';
  document.getElementById('form-titre').textContent = 'Enregistrer ce schéma';
  document.getElementById('btn-save-schema').textContent = "Enregistrer dans l'Espace Club";
  document.getElementById('btn-nouveau-schema').style.display = 'none';
  document.getElementById('msg-schema').className = 'msg';
  updateUI();
};

window.__supprimerSchema = async (id) => {
  if (!confirm("Supprimer ce schéma définitivement ?")) return;
  try {
    await deleteDoc(doc(db, 'plays', id));
    if (schemaEnEditionId === id) reinitialiserFormulaireCreation();
    await chargerSchemas();
  } catch (e) {
    alert("Erreur lors de la suppression : " + e.message);
  }
};

document.getElementById('flt-tous').addEventListener('click', (e) => activerFiltre(e.target, 'tous'));
document.getElementById('flt-tactique').addEventListener('click', (e) => activerFiltre(e.target, 'tactique'));
document.getElementById('flt-exercice').addEventListener('click', (e) => activerFiltre(e.target, 'exercice'));

function activerFiltre(btn, cat) {
  document.querySelectorAll('.puces .puce').forEach(b => b.classList.remove('actif'));
  btn.classList.add('actif');
  filtreActif = cat;
  afficherListeSchemas();
}

document.getElementById('btn-save-schema').addEventListener('click', async () => {
  const $msg = document.getElementById('msg-schema');
  const title = document.getElementById('schema-titre').value.trim();
  const type = document.getElementById('schema-type').value;
  const team_id = document.getElementById('schema-equipe').value;
  const notes = document.getElementById('schema-notes').value.trim();

  if (!title) {
    $msg.className = 'msg err'; $msg.textContent = 'Donne au moins un titre à ton schéma.'; return;
  }

  try {
    const payload = {
      title,
      type,
      team_id,
      notes,
      courtMode: currentMode,
      steps: steps,
      club_id: String(monProfil.club_id),
      updated_at: serverTimestamp()
    };

    if (schemaEnEditionId) {
      await setDoc(doc(db, 'plays', schemaEnEditionId), payload, { merge: true });
    } else {
      payload.created_by = auth.currentUser.uid;
      payload.created_at = serverTimestamp();
      await addDoc(collection(db, 'plays'), payload);
    }

    $msg.className = 'msg ok';
    $msg.textContent = '✅ Schéma enregistré avec succès !';
    
    reinitialiserFormulaireCreation();
    await chargerSchemas();
  } catch (e) {
    $msg.className = 'msg err';
    $msg.textContent = 'Erreur : ' + e.message;
  }
});

function drawCourt() {
  const lines = document.getElementById('court-lines');
  const svg = document.getElementById('court');
  
  if (currentMode === 'half') {
    svg.setAttribute('viewBox', '0 0 500 470');
    document.getElementById('board-container').style.aspectRatio = '500 / 470';
    lines.innerHTML = `
      <rect x="0" y="0" width="500" height="470" fill="var(--court-bg)"/>
      
      <!-- Lignes de fond et de touche -->
      <rect x="25" y="25" width="450" height="445" fill="none" stroke="#fff" stroke-width="3"/>
      
      <!-- Raquette (Paint) aux proportions FIBA -->
      <rect x="170" y="25" width="160" height="190" fill="none" stroke="#fff" stroke-width="3"/>
      
      <!-- Cercle des lancers francs -->
      <circle cx="250" cy="215" r="60" fill="none" stroke="#fff" stroke-width="3"/>
      
      <!-- Ligne des 3 points -->
      <path d="M 55 25 L 55 120 A 205 205 0 0 0 445 120 L 445 25" fill="none" stroke="#fff" stroke-width="3"/>
      
      <!-- Zone de non-charge (Arc sous l'anneau) -->
      <path d="M 210 60 A 40 40 0 0 0 290 60" fill="none" stroke="#fff" stroke-width="2"/>
      
      <!-- Panneau et anneau -->
      <line x1="215" y1="45" x2="285" y2="45" stroke="#fff" stroke-width="4"/>
      <circle cx="250" cy="55" r="10" fill="none" stroke="var(--offense)" stroke-width="3"/>
      <line x1="250" y1="45" x2="250" y2="48" stroke="#fff" stroke-width="3"/>
      
      <!-- Ligne médiane et demi-cercle central -->
      <line x1="25" y1="470" x2="475" y2="470" stroke="#fff" stroke-width="3"/>
      <path d="M 190 470 A 60 60 0 0 1 310 470" fill="none" stroke="#fff" stroke-width="3"/>
    `;
  } else {
    svg.setAttribute('viewBox', '0 0 500 940');
    document.getElementById('board-container').style.aspectRatio = '500 / 940';
    lines.innerHTML = `
      <rect x="0" y="0" width="500" height="940" fill="var(--court-bg)"/>
      
      <!-- Lignes de délimitation extérieures -->
      <rect x="25" y="25" width="450" height="890" fill="none" stroke="#fff" stroke-width="3"/>
      
      <!-- Ligne médiane et cercle central -->
      <line x1="25" y1="470" x2="475" y2="470" stroke="#fff" stroke-width="3"/>
      <circle cx="250" cy="470" r="60" fill="none" stroke="#fff" stroke-width="3"/>
      
      <!-- === DEMI-TERRAIN HAUT === -->
      <!-- Raquette -->
      <rect x="170" y="25" width="160" height="190" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="250" cy="215" r="60" fill="none" stroke="#fff" stroke-width="3"/>
      <!-- Ligne 3 points -->
      <path d="M 55 25 L 55 120 A 205 205 0 0 0 445 120 L 445 25" fill="none" stroke="#fff" stroke-width="3"/>
      <!-- Arc de non-charge -->
      <path d="M 210 60 A 40 40 0 0 0 290 60" fill="none" stroke="#fff" stroke-width="2"/>
      <!-- Panneau et anneau -->
      <line x1="215" y1="45" x2="285" y2="45" stroke="#fff" stroke-width="4"/>
      <circle cx="250" cy="55" r="10" fill="none" stroke="var(--offense)" stroke-width="3"/>
      <line x1="250" y1="45" x2="250" y2="48" stroke="#fff" stroke-width="3"/>
      
      <!-- === DEMI-TERRAIN BAS === -->
      <!-- Raquette -->
      <rect x="170" y="725" width="160" height="190" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="250" cy="725" r="60" fill="none" stroke="#fff" stroke-width="3"/>
      <!-- Ligne 3 points (inversée) -->
      <path d="M 55 915 L 55 820 A 205 205 0 0 1 445 820 L 445 915" fill="none" stroke="#fff" stroke-width="3"/>
      <!-- Arc de non-charge (inversé) -->
      <path d="M 210 880 A 40 40 0 0 1 290 880" fill="none" stroke="#fff" stroke-width="2"/>
      <!-- Panneau et anneau -->
      <line x1="215" y1="895" x2="285" y2="895" stroke="#fff" stroke-width="4"/>
      <circle cx="250" cy="885" r="10" fill="none" stroke="var(--offense)" stroke-width="3"/>
      <line x1="250" y1="895" x2="250" y2="892" stroke="#fff" stroke-width="3"/>
    `;
  }
}

function renderTokens(data) {
  const container = document.getElementById('tokens');
  container.innerHTML = '';
  
  data.forEach(t => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'token');
    g.setAttribute('transform', `translate(${t.x}, ${t.y})`);
    g.setAttribute('data-id', t.id);

    if (t.type === 'ball') {
      g.innerHTML = `<circle r="12" fill="var(--offense)"/><text y="1">${t.label}</text>`;
    } else {
      const color = t.type === 'offense' ? 'var(--offense)' : 'var(--defense)';
      g.innerHTML = `<circle r="17" fill="${color}" stroke="#fff" stroke-width="2"/><text y="1">${t.label}</text>`;
    }
    container.appendChild(g);
  });
  initDrag();
}

function renderTrajectories() {
  const container = document.getElementById('trajectories');
  container.innerHTML = '';

  if (!showTrajectories || currentStep >= steps.length - 1 || isPlaying) return;

  const currentData = steps[currentStep].tokens;
  const nextData = steps[currentStep + 1].tokens;
  const geste = GESTES[steps[currentStep].geste] || null;

  currentData.forEach(t => {
    const target = nextData.find(n => n.id === t.id);
    if (target && (t.x !== target.x || t.y !== target.y)) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', t.x); line.setAttribute('y1', t.y);
      line.setAttribute('x2', target.x); line.setAttribute('y2', target.y);
      
      const strokeColor = t.type === 'offense' ? 'var(--offense)' : (t.type === 'defense' ? 'var(--defense)' : '#fff');
      const marker = t.type === 'offense' ? 'url(#arrow-offense)' : (t.type === 'defense' ? 'url(#arrow-defense)' : 'url(#arrow-ball)');

      line.setAttribute('stroke', strokeColor);
      line.setAttribute('stroke-width', t.type === 'ball' ? '3' : '2.5');
      line.setAttribute('marker-end', marker);

      if (t.type === 'ball' && geste) {
        line.setAttribute('class', '');
        if (geste.trait) line.setAttribute('stroke-dasharray', geste.trait);
      } else {
        line.setAttribute('class', 'trajectory-line');
      }

      container.appendChild(line);
    }
  });
}

function initClicPanier() {
  const svg = document.getElementById('court');
  if (!svg || svg.dataset.clicPanier) return;
  svg.dataset.clicPanier = '1';
  const gerer = (e) => {
    if (!gesteEnAttente) return;
    const g = GESTES[gesteEnAttente];
    if (!g.tir) return;
    const p = getSVGCoords(e);
    const panier = positionPanier();
    if (Math.hypot(p.x - panier.x, p.y - panier.y) < 90) {
      if (e.cancelable) e.preventDefault();
      appliquerGeste(panier);
    }
  };
  svg.addEventListener('mousedown', gerer);
  svg.addEventListener('touchstart', gerer, { passive: false });
}

function getSVGCoords(e) {
  const svg = document.getElementById('court');
  const pt = svg.createSVGPoint();
  pt.x = e.touches ? e.touches[0].clientX : e.clientX;
  pt.y = e.touches ? e.touches[0].clientY : e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

const RAYON_POSSESSION = 26;
let porteurBallon = null;

function jetonsEtape() { return steps[currentStep].tokens; }
function jetonBalle() { return jetonsEtape().find(t => t.type === 'ball'); }

function trouverPorteur() {
  const balle = jetonBalle();
  if (!balle) return null;
  let meilleur = null, meilleureDist = RAYON_POSSESSION;
  jetonsEtape().forEach(t => {
    if (t.type === 'ball') return;
    const d = Math.hypot(t.x - balle.x, t.y - balle.y);
    if (d < meilleureDist) { meilleureDist = d; meilleur = t; }
  });
  return meilleur;
}

function initDrag() {
  initClicPanier();
  if (isPlaying || !estEditeur) return;
  document.querySelectorAll('.token').forEach(el => {
    const start = (e) => {
      if (e.cancelable) e.preventDefault();

      if (gesteEnAttente) {
        const idCible = el.getAttribute('data-id');
        const cible = jetonsEtape().find(t => t.id === idCible);
        const g = GESTES[gesteEnAttente];
        if (cible && !g.tir && cible.type !== 'ball') {
          appliquerGeste(cible);
          return;
        }
      }

      activeToken = el;
      const coords = getSVGCoords(e);
      const id = el.getAttribute('data-id');
      const data = jetonsEtape().find(t => t.id === id);
      offset.x = coords.x - data.x;
      offset.y = coords.y - data.y;

      porteurBallon = null;
      if (data.type !== 'ball') {
        const porteur = trouverPorteur();
        if (porteur && porteur.id === id) {
          const balle = jetonBalle();
          porteurBallon = { dx: balle.x - data.x, dy: balle.y - data.y };
        }
      }
    };
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, { passive: false });
  });
}

const move = (e) => {
  if (!activeToken || isPlaying || !estEditeur) return;
  if (e.cancelable) e.preventDefault();
  const coords = getSVGCoords(e);
  const id = activeToken.getAttribute('data-id');
  const data = jetonsEtape().find(t => t.id === id);
  data.x = coords.x - offset.x;
  data.y = coords.y - offset.y;
  activeToken.setAttribute('transform', `translate(${data.x}, ${data.y})`);

  if (porteurBallon) {
    const balle = jetonBalle();
    balle.x = data.x + porteurBallon.dx;
    balle.y = data.y + porteurBallon.dy;
    const elBalle = document.querySelector('.token[data-id="BALL"]');
    if (elBalle) elBalle.setAttribute('transform', `translate(${balle.x}, ${balle.y})`);
  }

  renderTrajectories();
};

const end = () => { activeToken = null; porteurBallon = null; };

window.addEventListener('mousemove', move);
window.addEventListener('touchmove', move, { passive: false });
window.addEventListener('mouseup', end);
window.addEventListener('touchend', end);
window.addEventListener('touchcancel', end);

const GESTES = {
  shoot:       { label: 'Shoot',        arc: 90,  duree: 1.0, tir: true,  trait: '2 6' },
  layup:       { label: 'Lay-up',       arc: 45,  duree: 0.8, tir: true,  trait: '6 4' },
  power_layup: { label: 'Power Lay-up', arc: 28,  duree: 0.6, tir: true,  trait: '' },
  handoff:     { label: 'Hand-off',     arc: 6,   duree: 0.5, tir: false, trait: '1 4' },
  chest:       { label: 'Chest pass',   arc: 14,  duree: 0.45, tir: false, trait: '' },
  bounce:      { label: 'Bounce pass',  arc: -30, duree: 0.6, tir: false, trait: '8 5' },
};

let gesteEnAttente = null;

function positionPanier() {
  const balle = jetonBalle();
  if (currentMode === 'full' && balle) {
    return balle.y < 235 ? { x: 250, y: 60 } : { x: 250, y: 410 };
  }
  return { x: 250, y: 60 };
}

function majAideGeste() {
  const $aide = document.getElementById('aide-geste');
  if (!$aide) return;
  if (!gesteEnAttente) {
    $aide.textContent = "Choisis une action, puis touche le destinataire (passe) ou le panier (tir).";
    $aide.style.color = '';
  } else {
    const g = GESTES[gesteEnAttente];
    $aide.textContent = g.tir
      ? `${g.label} : touche le panier pour valider.`
      : `${g.label} : touche le joueur qui reçoit la balle.`;
    $aide.style.color = 'var(--orange)';
  }
  document.querySelectorAll('.btn-geste').forEach(b =>
    b.classList.toggle('actif-geste', b.dataset.geste === gesteEnAttente));
}

document.querySelectorAll('.btn-geste').forEach(btn => {
  btn.addEventListener('click', () => {
    gesteEnAttente = (gesteEnAttente === btn.dataset.geste) ? null : btn.dataset.geste;
    majAideGeste();
  });
});

function appliquerGeste(cible) {
  const g = GESTES[gesteEnAttente];
  if (!g) return;

  steps[currentStep].geste = gesteEnAttente;

  const suivante = {
    step: steps.length + 1,
    geste: null,
    tokens: JSON.parse(JSON.stringify(jetonsEtape())),
  };
  const balle = suivante.tokens.find(t => t.type === 'ball');
  if (balle) {
    balle.x = cible.x + (g.tir ? 0 : 14);
    balle.y = cible.y + (g.tir ? 0 : 14);
  }

  steps.splice(currentStep + 1, 0, suivante);
  steps.forEach((s, i) => { s.step = i + 1; });
  currentStep = currentStep + 1;
  gesteEnAttente = null;
  majAideGeste();
  updateUI();
}

function updateUI() {
  document.getElementById('step-counter').textContent = `Étape ${currentStep + 1} / ${steps.length}`;
  renderTokens(steps[currentStep].tokens);
  renderTrajectories();
}

window.addStep = () => {
  const newTokens = JSON.parse(JSON.stringify(steps[currentStep].tokens));
  steps.splice(currentStep + 1, 0, { step: steps.length + 1, tokens: newTokens });
  currentStep++;
  updateUI();
};

window.deleteStep = () => {
  if (steps.length <= 1) return;
  steps.splice(currentStep, 1);
  if (currentStep >= steps.length) currentStep = steps.length - 1;
  updateUI();
};

window.nextStep = () => {
  if (currentStep < steps.length - 1) { currentStep++; updateUI(); }
};

window.prevStep = () => {
  if (currentStep > 0) { currentStep--; updateUI(); }
};

window.togglePlay = () => {
  if (isPlaying) stopAnimation();
  else startAnimation();
};

function startAnimation() {
  if (steps.length < 2) return;
  isPlaying = true;
  const $btn = document.getElementById('btn-play');
  $btn.textContent = '⏸️ Pause';
  $btn.className = 'btn btn-ghost btn-sm';

  if (currentStep >= steps.length - 1) currentStep = 0;
  
  let startTime = null;

  function animateFrame(timestamp) {
    if (!startTime) startTime = timestamp;
    let elapsed = timestamp - startTime;
    let progress = elapsed / window.speed;

    if (progress >= 1) {
      currentStep++;
      if (currentStep >= steps.length - 1) {
        updateUI();
        stopAnimation();
        return;
      }
      startTime = timestamp;
      progress = 0;
    }

    const fromData = steps[currentStep].tokens;
    const toData = steps[currentStep + 1].tokens;
    const geste = GESTES[steps[currentStep].geste] || null;

    const interpolated = fromData.map(t => {
      const target = toData.find(n => n.id === t.id);
      if (!target) return { ...t };

      if (t.type === 'ball' && geste) {
        const p = Math.min(1, progress / geste.duree);
        const x = t.x + (target.x - t.x) * p;
        let y = t.y + (target.y - t.y) * p;
        y -= Math.sin(Math.PI * p) * geste.arc;
        return { ...t, x, y };
      }

      return {
        ...t,
        x: t.x + (target.x - t.x) * progress,
        y: t.y + (target.y - t.y) * progress
      };
    });

    renderTokens(interpolated);
    document.getElementById('step-counter').textContent = `Étape ${currentStep + 1} ➔ ${currentStep + 2}`;
    animFrame = requestAnimationFrame(animateFrame);
  }

  renderTrajectories();
  animFrame = requestAnimationFrame(animateFrame);
}

function stopAnimation() {
  isPlaying = false;
  cancelAnimationFrame(animFrame);
  const $btn = document.getElementById('btn-play');
  $btn.textContent = '▶️ Jouer';
  $btn.className = 'btn btn-primary btn-sm';
  updateUI();
}

window.setCourt = (mode) => {
  currentMode = mode;
  document.getElementById('btn-half').classList.toggle('actif', mode === 'half');
  document.getElementById('btn-full').classList.toggle('actif', mode === 'full');
  drawCourt();
  renderTrajectories();
};

window.toggleTrajectories = () => {
  showTrajectories = !showTrajectories;
  document.getElementById('btn-traj').classList.toggle('actif', showTrajectories);
  renderTrajectories();
};

window.resetAll = () => {
  if (confirm("Réinitialiser le plateau et effacer les étapes non enregistrées ?")) {
    reinitialiserFormulaireCreation();
  }
};

function appliquerEffectif() {
  const o = parseInt(document.getElementById('nb-offense').value, 10);
  const d = parseInt(document.getElementById('nb-defense').value, 10);
  if (steps.length > 1 && !confirm("Changer le nombre de joueurs reinitialise les etapes en cours. Continuer ?")) {
    document.getElementById('nb-offense').value = nbOffense;
    document.getElementById('nb-defense').value = nbDefense;
    return;
  }
  nbOffense = o; nbDefense = d;
  steps = [ { step: 1, tokens: construireEffectif(nbOffense, nbDefense), geste: null } ];
  currentStep = 0;
  activeToken = null;
  drawCourt();
  updateUI();
}
document.getElementById('nb-offense').addEventListener('change', appliquerEffectif);
document.getElementById('nb-defense').addEventListener('change', appliquerEffectif);

drawCourt();
updateUI();
</script>
