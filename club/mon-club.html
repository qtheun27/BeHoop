<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon Club — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .joueur-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  /* Important : on autorise le débordement de la carte pour que le menu déroulant s'affiche ! */
  .carte { overflow: visible !important; }
  .dropdown-menu { display: none; position: absolute; right: 0; top: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-md); z-index: 99; min-width: 220px; }
  .dropdown-menu.ouvert { display: block; }
  .dropdown-menu a { display: block; padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border-soft); }
  .dropdown-menu a:last-child { border-bottom: none; }
  .dropdown-menu a:hover { background: var(--surface-2); }
</style>
</head>
<body>
<div class="container" style="padding-top:16px;">

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-equipes">👥 Équipes & Membres</button>
    <button class="tab-btn" data-tab="tab-calendrier">📅 Calendrier Club</button>
  </div>

  <!-- ONGLET 1 : ÉQUIPES & JOUEURS -->
  <div id="tab-equipes" class="tab-content active">
    <div class="carte">
      <div class="carte-titre">Membres de l'équipe</div>
      <div class="puces" id="tabs-equipes"></div>
      
      <div style="margin-top:14px; padding-top: 14px; border-top: 1px solid var(--border-soft);">
        <label class="champ-label">Inviter un membre dans cette équipe</label>
        <select id="inv-role" style="margin-bottom:8px;">
          <option value="player">🏀 Joueur</option>
          <option value="coach">📋 Coach</option>
          <option value="parent">👨‍👩‍👧 Parent</option>
        </select>
        <div class="grille-2">
          <input type="text" id="inv-prenom" placeholder="Prénom">
          <input type="text" id="inv-nom" placeholder="Nom">
        </div>
        <input type="email" id="inv-email" placeholder="Adresse email" style="margin-top:8px;">
        <button class="btn btn-primary btn-block" id="btn-inviter" style="margin-top:10px;">Générer l'invitation</button>
        <div class="msg" id="msg-inv"></div>
      </div>

      <div id="liste-joueurs-equipe" style="margin-top:20px;"><p class="vide">Chargement…</p></div>
    </div>
  </div>

  <!-- ONGLET 2 : CALENDRIER CLUB -->
  <div id="tab-calendrier" class="tab-content">
    <div class="carte">
      <div class="carte-titre">Programmer un événement</div>
      
      <label class="champ-label">Équipe ciblée</label>
      <select id="cal-target-team">
        <option value="all">Toutes les équipes du club</option>
      </select>

      <label class="champ-label">Type</label>
      <select id="cal-type">
        <option value="evenement">📅 Événement (Souper, réunion...)</option>
        <option value="entrainement">🏋️ Entraînement</option>
        <option value="match">🏀 Match</option>
      </select>

      <div class="grille-2" style="margin-top:6px;">
        <div><label class="champ-label">Date</label><input type="date" id="cal-date"></div>
        <div><label class="champ-label">Heure</label><input type="time" id="cal-heure" value="18:00"></div>
      </div>

      <label class="champ-label" style="margin-top:6px;">Lieu</label>
      <input type="text" id="cal-lieu" placeholder="Salle / Adresse">

      <button class="btn btn-primary" id="btn-save-cal" style="margin-top:16px;">Ajouter au calendrier</button>
      <div class="msg" id="msg-cal"></div>
    </div>
  </div>

</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs, query, where, updateDoc, arrayUnion, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml, nomAffichage } from "./avatar.js";
import { rendreNav, rendreNavImmediat, rendreEntete } from "./nav.js";

rendreEntete('Mon Club');
rendreNavImmediat('espace');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let monProfil = null;
let clubEquipes = [];
let equipeActive = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'club_admin') { window.location.href = './dashboard.html'; return; }
  
  monProfil = snap.data();
  rendreNav('club_admin', 'espace');

  await chargerEquipesClub();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

async function chargerEquipesClub() {
  try {
    const res = await fetch('../data.json?t=' + Date.now());
    const donnees = await res.json();
    const clubId = monProfil.club_id;
    const club = (donnees.clubs || []).find(c => String(c.id) === String(clubId));
    
    clubEquipes = club ? (club.teams || []) : [];

    const $select = document.getElementById('cal-target-team');
    document.getElementById('tabs-equipes').innerHTML = clubEquipes.map((eq, i) => {
      const opt = document.createElement('option');
      opt.value = String(eq.id);
      opt.textContent = eq.category || eq.name;
      $select.appendChild(opt);

      return `<button class="puce ${i === 0 ? 'actif' : ''}" data-id="${eq.id}">${eq.category || eq.name}</button>`;
    }).join('');

    document.querySelectorAll('#tabs-equipes .puce').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#tabs-equipes .puce').forEach(b => b.classList.remove('actif'));
        btn.classList.add('actif');
        equipeActive = btn.dataset.id;
        chargerJoueursEquipe();
      });
    });

    if (clubEquipes.length > 0) {
      equipeActive = String(clubEquipes[0].id);
      chargerJoueursEquipe();
    }
  } catch(e) {
    document.getElementById('tabs-equipes').innerHTML = `<p class="vide">Erreur lors du chargement des équipes.</p>`;
  }
}

async function chargerJoueursEquipe() {
  const $liste = document.getElementById('liste-joueurs-equipe');
  $liste.innerHTML = 'Chargement…';

  const q = query(collection(db, 'players'), where('team_id', '==', equipeActive));
  const snap = await getDocs(q);

  if (snap.empty) {
    $liste.innerHTML = '<p class="vide">Aucun joueur dans cette équipe.</p>';
    return;
  }

  $liste.innerHTML = snap.docs.map(d => {
    const j = { id: d.id, ...d.data() };
    return `
      <div class="joueur-item">
        <div style="display:flex;align-items:center;gap:10px;">
          ${avatarHtml(j.photo_url, nomAffichage(j), 36)}
          <div>
            <div style="font-weight:800; font-size:14px;">${nomAffichage(j)}</div>
            <div style="font-size:12px;color:var(--text-muted);">${j.email || 'Aucune adresse email'}</div>
          </div>
        </div>
        
        <div style="position:relative;">
          <button class="btn-ghost" style="font-size:18px; padding: 4px 10px;" onclick="window.__toggleMenuJoueur('${j.id}')">⋮</button>
          <div class="dropdown-menu" id="menu-j-${j.id}">
            <a href="#" onclick="window.__editerJoueur('${j.id}'); return false;">✏️ Modifier infos ou email</a>
            <a href="#" onclick="window.__associerParent('${j.id}'); return false;">👨‍👩‍👧 Associer un compte Parent</a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// Fonction pour ouvrir/fermer le menu à 3 points
window.__toggleMenuJoueur = (id) => {
  const leMenu = document.getElementById('menu-j-' + id);
  const etaitOuvert = leMenu.classList.contains('ouvert');
  
  // Ferme tous les autres
  document.querySelectorAll('.dropdown-menu.ouvert').forEach(m => m.classList.remove('ouvert'));
  
  if (!etaitOuvert) leMenu.classList.add('ouvert');
};

document.addEventListener('click', e => {
  if (!e.target.closest('.joueur-item')) {
    document.querySelectorAll('.dropdown-menu.ouvert').forEach(m => m.classList.remove('ouvert'));
  }
});

// Envoi d'une invitation générique (Joueur, Coach, Parent) depuis l'équipe
document.getElementById('btn-inviter').addEventListener('click', async () => {
  const role = document.getElementById('inv-role').value;
  const prenom = document.getElementById('inv-prenom').value.trim();
  const nom = document.getElementById('inv-nom').value.trim();
  const email = document.getElementById('inv-email').value.trim().toLowerCase();
  const $msg = document.getElementById('msg-inv');

  if (!prenom || !email) { $msg.className='msg err'; $msg.textContent='Prénom et email requis.'; return; }

  try {
    let payloadInvite = {
      role: role,
      club_id: monProfil.club_id,
      team_id: equipeActive,
      status: 'pending',
      created_by: auth.currentUser.uid,
      created_at: serverTimestamp()
    };

    if (role === 'player') {
      const newPlayer = await addDoc(collection(db, 'players'), {
        club_id: monProfil.club_id,
        team_id: equipeActive,
        account_uid: '',
        parent_uids: [],
        prenom, nom, email,
        created_at: serverTimestamp()
      });
      payloadInvite.player_id = newPlayer.id;
    }

    await setDoc(doc(db, 'invitations', email), payloadInvite);

    $msg.className = 'msg ok'; $msg.textContent = '✅ Invitation envoyée à ' + email;
    document.getElementById('inv-prenom').value = '';
    document.getElementById('inv-nom').value = '';
    document.getElementById('inv-email').value = '';
    
    if (role === 'player') await chargerJoueursEquipe();
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = e.message;
  }
});

// Modification des informations et de l'email AVEC préservation des statistiques
window.__editerJoueur = async (playerId) => {
  const pSnap = await getDoc(doc(db, 'players', playerId));
  if (!pSnap.exists()) return;
  const p = pSnap.data();

  const prenom = prompt("Prénom :", p.prenom || '')?.trim();
  const nom = prompt("Nom :", p.nom || '')?.trim();
  const email = prompt("Nouvel email de connexion (laissez vide si inchangé) :", p.email || '')?.trim().toLowerCase();

  if (!prenom) return;

  await updateDoc(doc(db, 'players', playerId), { prenom, nom: nom || '' });

  if (email && email !== p.email) {
    await updateDoc(doc(db, 'players', playerId), { email });

    // Si le joueur avait un compte lié à l'ancienne adresse, on le supprime (par sécurité)
    if (p.account_uid) {
      try { await deleteDoc(doc(db, 'users', p.account_uid)); } catch(e) {}
      await updateDoc(doc(db, 'players', playerId), { account_uid: '' });
    }

    // On génère une nouvelle invitation
    await setDoc(doc(db, 'invitations', email), {
      role: 'player',
      club_id: monProfil.club_id,
      team_id: p.team_id,
      player_id: playerId,
      status: 'pending',
      created_at: serverTimestamp()
    });
    alert(`Informations mises à jour.\nUne invitation d'accès a été générée pour l'adresse : ${email}\nL'ancien accès (s'il y en avait un) a été révoqué.`);
  } else {
    alert("Informations mises à jour.");
  }
  
  await chargerJoueursEquipe();
};

// Associer la fiche du joueur à un compte parent existant
window.__associerParent = async (playerId) => {
  const emailParent = prompt("Email du compte Parent à lier :")?.trim().toLowerCase();
  if (!emailParent) return;

  const q = query(collection(db, 'users'), where('email', '==', emailParent));
  const snap = await getDocs(q);

  if (snap.empty) {
    alert("Aucun compte Parent trouvé avec cette adresse.\nAssurez-vous d'abord de l'avoir invité avec le rôle 'Parent'.");
    return;
  }

  const parentDoc = snap.docs[0];
  if (parentDoc.data().role !== 'parent') {
    alert("Cet utilisateur existe mais n'a pas le rôle 'Parent'.");
    return;
  }

  const parentUid = parentDoc.id;
  await updateDoc(doc(db, 'players', playerId), { parent_uids: arrayUnion(parentUid) });
  await updateDoc(doc(db, 'users', parentUid), { children_player_ids: arrayUnion(playerId) });

  alert("Le parent a été lié au joueur avec succès !");
};

// Ajouter un événement au calendrier (par l'administrateur)
document.getElementById('btn-save-cal').addEventListener('click', async () => {
  const $msg = document.getElementById('msg-cal');
  const target = document.getElementById('cal-target-team').value;
  const type = document.getElementById('cal-type').value;
  const date = document.getElementById('cal-date').value;
  const heure = document.getElementById('cal-heure').value;
  const lieu = document.getElementById('cal-lieu').value.trim();

  if (!date) { $msg.className = 'msg err'; $msg.textContent = 'Sélectionnez au moins une date.'; return; }

  try {
    const teamsToApply = target === 'all' ? clubEquipes.map(e => String(e.id)) : [target];
    
    for (const tid of teamsToApply) {
      await addDoc(collection(db, 'trainings'), {
        team_id: tid, type, date, start_time: heure, location: lieu,
        club_id: monProfil.club_id, created_by: auth.currentUser.uid, created_at: serverTimestamp()
      });
    }

    $msg.className = 'msg ok'; $msg.textContent = '✅ Événement ajouté au calendrier !';
    document.getElementById('cal-date').value = '';
    document.getElementById('cal-lieu').value = '';
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
});
</script>
</body>
</html>
