<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeHoop">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<title>Mon club — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .equipe { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 8px; }
  .equipe-titre { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .equipe-titre strong { font-size: 14.5px; }
  .equipe-form { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
  .equipe-form.ouvert { display: block; }
  .ligne-invite { display: flex; gap: 8px; margin-bottom: 8px; }
  .ligne-invite input { flex: 1; }
  h4.sous-section { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 14px 0 6px; }
  .ligne-joueur { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
  .ligne-joueur:last-child { border-bottom: none; }
  .ligne-joueur input[type="checkbox"] { width: 17px; height: 17px; flex-shrink: 0; }
  .ligne-joueur .infos-joueur { flex: 1; min-width: 120px; }
  .lien-parent { display: flex; gap: 6px; align-items: center; width: 100%; margin-top: 4px; margin-left: 27px; }
  .lien-parent select { flex: 1; font-size: 12.5px; padding: 6px 8px; }
  .barre-action { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .barre-action select { flex: 1; }
  .ajout-rapide { display: flex; gap: 8px; margin-top: 12px; }
  .ajout-rapide input { flex: 1; }
</style>
</head>
<body>
<div class="container" style="padding-top:16px;">

  <div class="carte">
    <div class="carte-titre">Équipes engagées cette saison</div>
    <div class="carte-desc">Touche une équipe pour voir/gérer son coach et ses joueurs.</div>
    <div id="liste-equipes"><p class="vide">Chargement…</p></div>
  </div>


  <div class="carte">
    <div class="carte-titre">Invitations de mon club</div>
    <div id="corps-invitations"><p class="vide">Chargement…</p></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Comptes de connexion du club</div>
    <div class="carte-desc">Coachs, parents et joueurs ayant leur propre compte.</div>
    <div id="corps-membres"><p class="vide">Chargement…</p></div>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp, arrayUnion,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { rendreNav, rendreNavImmediat, rendreEntete } from "./nav.js";

rendreEntete('Mon club');
rendreNavImmediat('espace');
import { avatarHtml, nomAffichage } from "./avatar.js";

const SITE_URL_CONNEXION = "https://behoop.be/club/finaliser-connexion.html";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let monClubId = null;
let monClubNom = null;
let equipesDuClub = [];
let tousLesCoachs = [];   // {uid, ..., team_ids}
let tousLesJoueurs = [];  // {id, ..., team_id}
let tousLesParents = [];  // {uid, ...}

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'club_admin') {
    window.location.href = './dashboard.html';
    return;
  }

  rendreNav('club_admin', 'espace');
  monClubId = snap.data().club_id;
  monClubNom = snap.data().club_name || null;

  await chargerClub();
  await chargerDonneesMembres();
  await chargerInvitations();
  await chargerMembres();
  afficherEquipes();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.menu-points')) {
    document.querySelectorAll('.menu-deroulant.ouvert').forEach(m => m.classList.remove('ouvert'));
  }
});

async function chargerClub() {
  const res = await fetch('../data.json?t=' + Date.now());
  const donnees = await res.json();
  const club = (donnees.clubs || []).find(c => String(c.id) === String(monClubId));
  monClubNom = club ? club.name : monClubNom;
  equipesDuClub = club ? (club.teams || []) : [];
  // Le nom du club est affiché par l'en-tête partagé (rendreEntete).
  rendreEntete(monClubNom || 'Mon club');
}

// Charge une seule fois coachs/joueurs/parents du club, réutilisé pour
// chaque équipe (évite une requête Firestore par équipe dépliée).
async function chargerDonneesMembres() {
  const qCoachs = query(collection(db, 'users'), where('club_id', '==', String(monClubId)), where('role', '==', 'coach'));
  const qJoueurs = query(collection(db, 'players'), where('club_id', '==', String(monClubId)));
  const qParents = query(collection(db, 'users'), where('club_id', '==', String(monClubId)), where('role', '==', 'parent'));
  const [snapCoachs, snapJoueurs, snapParents] = await Promise.all([getDocs(qCoachs), getDocs(qJoueurs), getDocs(qParents)]);
  tousLesCoachs = snapCoachs.docs.map(d => ({ uid: d.id, ...d.data() }));
  tousLesJoueurs = snapJoueurs.docs.map(d => ({ id: d.id, ...d.data() }));
  tousLesParents = snapParents.docs.map(d => ({ uid: d.id, ...d.data() }));
}

function afficherEquipes() {
  const optionsEquipes = '<option value="">— Choisir —</option>' +
    equipesDuClub.map(eq => `<option value="${eq.id}">${eq.category || eq.name}</option>`).join('');

  const $liste = document.getElementById('liste-equipes');
  if (equipesDuClub.length === 0) {
    $liste.innerHTML = '<p class="vide">Aucune équipe trouvée pour ce club cette saison.</p>';
    return;
  }

  $liste.innerHTML = equipesDuClub.map(eq => {
    const coachs = tousLesCoachs.filter(c => (c.team_ids || []).includes(String(eq.id)));
    const joueurs = tousLesJoueurs.filter(j => String(j.team_id) === String(eq.id));
    return `
    <div class="equipe" data-team-id="${eq.id}">
      <div class="equipe-titre" onclick="document.getElementById('form-${eq.id}').classList.toggle('ouvert')">
        <strong>${eq.category || eq.name}</strong>
        <span class="badge badge-muted">${coachs.length} coach · ${joueurs.length} joueur(s)</span>
      </div>
      <div class="equipe-form" id="form-${eq.id}">
        <div class="ligne-invite">
          <input type="email" id="email-coach-${eq.id}" placeholder="email du coach">
          <button class="btn btn-primary btn-sm" data-action="coach" data-team="${eq.id}">Inviter coach</button>
        </div>
        <div class="ligne-invite">
          <input type="email" id="email-joueur-${eq.id}" placeholder="email du joueur">
          <button class="btn btn-primary btn-sm" data-action="player" data-team="${eq.id}">Inviter joueur</button>
        </div>
        <div class="msg" id="msg-${eq.id}"></div>

        <h4 class="sous-section">Coach(s)</h4>
        ${coachs.length ? coachs.map(c => `
          <div class="ligne-joueur">
            ${avatarHtml(c.photo_url, nomAffichage(c), 30)}
            <div class="infos-joueur"><div class="nom">${nomAffichage(c)}</div><div class="sous-texte">${c.email}</div></div>
          </div>
        `).join('') : '<p class="vide">Aucun coach pour le moment.</p>'}

        <h4 class="sous-section">Joueurs</h4>
        ${joueurs.length ? joueurs.map(j => `
          <div class="ligne-joueur">
            <input type="checkbox" class="case-joueur-${eq.id}" value="${j.id}">
            ${avatarHtml(j.photo_url, nomAffichage(j), 30)}
            <div class="infos-joueur">
              <div class="nom">${nomAffichage(j)}${!j.account_uid ? ' <span class="badge badge-muted">géré par parent</span>' : ''}</div>
            </div>
            ${(j.parent_uids && j.parent_uids.length) ? '<span class="badge badge-success" style="flex-shrink:0;">Parent lié</span>' : ''}
            <div class="menu-points" style="position:relative;flex-shrink:0;">
              <button class="btn-points" data-menu="${j.id}" aria-label="Options">⋯</button>
              <div class="menu-deroulant" id="menu-${j.id}">
                <button data-modifier="${j.id}">Modifier les informations</button>
                ${(!j.parent_uids || !j.parent_uids.length) ? `<button data-assoc="${j.id}">Associer à un parent</button>` : ''}
                <button data-suppr="${j.id}" class="danger">Supprimer ce joueur</button>
              </div>
            </div>
            <div class="zone-edition" id="edition-${j.id}">
              <div class="grille-2">
                <input type="text" id="edit-prenom-${j.id}" value="${(j.prenom || '').replace(/"/g, '&quot;')}" placeholder="Prénom">
                <input type="text" id="edit-nom-${j.id}" value="${(j.nom || '').replace(/"/g, '&quot;')}" placeholder="Nom">
              </div>
              <input type="email" id="edit-email-${j.id}" style="margin-top:8px;" placeholder="Email (envoie une invitation)" value="${(j.email || '').replace(/"/g, '&quot;')}">
              <p class="vide" style="font-size:11.5px;margin-top:4px;">Renseigner un email envoie une invitation : le joueur (ou son parent) créera son accès. L'ancien accès est révoqué.</p>
              <div style="display:flex;gap:8px;margin-top:10px;">
                <button class="btn btn-primary btn-sm" data-save="${j.id}">Enregistrer</button>
                <button class="btn-ghost" data-annuler="${j.id}">Annuler</button>
              </div>
              <div class="msg" id="msg-edit-${j.id}"></div>
            </div>
            <div class="zone-assoc" id="assoc-${j.id}">
              <select id="parent-select-${j.id}">
                <option value="">Choisir un parent...</option>
                ${tousLesParents.map(p => `<option value="${p.uid}">${nomAffichage(p)} (${p.email})</option>`).join('')}
              </select>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button class="btn btn-primary btn-sm" data-lier="${j.id}">Lier</button>
                <button class="btn-ghost" data-annuler-assoc="${j.id}">Annuler</button>
              </div>
            </div>
          </div>
        `).join('') : '<p class="vide">Aucun joueur pour le moment.</p>'}

        <div class="ajout-rapide">
          <input type="text" id="prenom-rapide-${eq.id}" placeholder="Prénom">
          <input type="text" id="nom-rapide-${eq.id}" placeholder="Nom">
          <button class="btn btn-secondary btn-sm" data-ajout="${eq.id}">+ Joueur sans email</button>
        </div>

        ${joueurs.length > 1 ? `
          <div class="barre-action">
            <select id="cible-bulk-${eq.id}">${optionsEquipes}</select>
            <button class="btn btn-secondary btn-sm" data-bulk="${eq.id}">Déplacer la sélection</button>
          </div>
        ` : ''}
        <div class="msg" id="msg-gestion-${eq.id}"></div>
      </div>
    </div>
  `;
  }).join('');

  document.querySelectorAll('[data-action="coach"]').forEach(btn =>
    btn.addEventListener('click', () => inviter('coach', btn.dataset.team)));
  document.querySelectorAll('[data-action="player"]').forEach(btn =>
    btn.addEventListener('click', () => inviter('player', btn.dataset.team)));
  document.querySelectorAll('[data-lier]').forEach(btn =>
    btn.addEventListener('click', () => lierAParent(btn.dataset.lier)));

  // --- Menu 3 points par joueur ---
  document.querySelectorAll('[data-menu]').forEach(btn =>
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.menu;
      document.querySelectorAll('.menu-deroulant.ouvert').forEach(m => {
        if (m.id !== 'menu-' + id) m.classList.remove('ouvert');
      });
      document.getElementById('menu-' + id).classList.toggle('ouvert');
    }));

  document.querySelectorAll('[data-modifier]').forEach(btn =>
    btn.addEventListener('click', () => {
      const id = btn.dataset.modifier;
      document.getElementById('menu-' + id).classList.remove('ouvert');
      document.getElementById('assoc-' + id).classList.remove('ouvert');
      document.getElementById('edition-' + id).classList.toggle('ouvert');
    }));

  document.querySelectorAll('[data-assoc]').forEach(btn =>
    btn.addEventListener('click', () => {
      const id = btn.dataset.assoc;
      document.getElementById('menu-' + id).classList.remove('ouvert');
      document.getElementById('edition-' + id).classList.remove('ouvert');
      document.getElementById('assoc-' + id).classList.toggle('ouvert');
    }));

  document.querySelectorAll('[data-annuler]').forEach(btn =>
    btn.addEventListener('click', () =>
      document.getElementById('edition-' + btn.dataset.annuler).classList.remove('ouvert')));

  document.querySelectorAll('[data-annuler-assoc]').forEach(btn =>
    btn.addEventListener('click', () =>
      document.getElementById('assoc-' + btn.dataset.annulerAssoc).classList.remove('ouvert')));

  document.querySelectorAll('[data-save]').forEach(btn =>
    btn.addEventListener('click', () => enregistrerJoueur(btn.dataset.save)));

  document.querySelectorAll('[data-suppr]').forEach(btn =>
    btn.addEventListener('click', () => supprimerJoueur(btn.dataset.suppr)));
  document.querySelectorAll('[data-ajout]').forEach(btn =>
    btn.addEventListener('click', () => ajouterJoueurRapide(btn.dataset.ajout)));
  document.querySelectorAll('[data-bulk]').forEach(btn =>
    btn.addEventListener('click', () => deplacerSelection(btn.dataset.bulk)));
}

async function rafraichirEtReafficher() {
  await chargerDonneesMembres();
  afficherEquipes();
}

async function assurerEquipeExiste(teamId) {
  const eq = equipesDuClub.find(e => String(e.id) === String(teamId));
  await setDoc(doc(db, 'teams', String(teamId)), {
    club_id: String(monClubId),
    name: eq ? eq.name : '',
    category: eq ? eq.category : '',
  }, { merge: true });
}

async function envoyerInvitation(email, role, teamId, extra = {}) {
  await setDoc(doc(db, 'invitations', email), {
    role,
    club_id: String(monClubId),
    club_name: monClubNom,
    team_id: teamId ? String(teamId) : null,
    status: 'pending',
    created_by: auth.currentUser.uid,
    created_at: serverTimestamp(),
    ...extra,
  });
  await sendSignInLinkToEmail(auth, email, { url: SITE_URL_CONNEXION, handleCodeInApp: true });
}

async function inviter(role, teamId) {
  const champId = role === 'coach' ? `email-coach-${teamId}` : `email-joueur-${teamId}`;
  const email = document.getElementById(champId).value.trim().toLowerCase();
  const $msg = document.getElementById('msg-' + teamId);
  if (!email || !email.includes('@')) {
    $msg.className = 'msg err'; $msg.textContent = 'Email invalide.'; return;
  }
  try {
    await assurerEquipeExiste(teamId);
    await envoyerInvitation(email, role, teamId);
    $msg.className = 'msg ok';
    $msg.textContent = role === 'player'
      ? `✅ Email envoyé à ${email}. À sa première connexion, il précisera s'il est le joueur ou un parent.`
      : `✅ Email envoyé à ${email}.`;
    document.getElementById(champId).value = '';
    await chargerInvitations();
  } catch (e) {
    $msg.className = 'msg err';
    $msg.textContent = 'Erreur : ' + e.message;
  }
}

// Modification d'un joueur : nom/prenom, et email qui declenche une
// invitation. Si le joueur avait deja un compte, celui-ci est revoque :
// l'acces est reconstruit proprement via la nouvelle invitation.
async function enregistrerJoueur(playerId) {
  const prenom = document.getElementById('edit-prenom-' + playerId).value.trim();
  const nom = document.getElementById('edit-nom-' + playerId).value.trim();
  const email = document.getElementById('edit-email-' + playerId).value.trim().toLowerCase();
  const $msg = document.getElementById('msg-edit-' + playerId);
  if (!prenom) { $msg.className = 'msg err'; $msg.textContent = 'Le prénom est obligatoire.'; return; }

  const joueur = tousLesJoueurs.find(j => j.id === playerId);
  try {
    await updateDoc(doc(db, 'players', playerId), { prenom, nom, email: email || null });

    // Nouvel email (ou email modifie) : on envoie une invitation et on
    // revoque l'ancien acces s'il existait.
    if (email && email !== (joueur?.email || '')) {
      if (joueur?.account_uid) {
        await deleteDoc(doc(db, 'users', joueur.account_uid));
        await updateDoc(doc(db, 'players', playerId), { account_uid: '' });
      }
      await envoyerInvitation(email, 'player', joueur?.team_id || null);
      $msg.className = 'msg ok';
      $msg.textContent = `✅ Enregistré. Invitation envoyée à ${email}.`;
    } else {
      $msg.className = 'msg ok'; $msg.textContent = '✅ Enregistré.';
    }
    await rafraichirEtReafficher();
    await chargerInvitations();
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
}

async function supprimerJoueur(playerId) {
  const joueur = tousLesJoueurs.find(j => j.id === playerId);
  if (!confirm(`Supprimer ${nomAffichage(joueur || {})} du club ? Ses statistiques resteront mais il n'apparaîtra plus dans les équipes.`)) return;
  try {
    if (joueur?.account_uid) await deleteDoc(doc(db, 'users', joueur.account_uid));
    await deleteDoc(doc(db, 'players', playerId));
    await rafraichirEtReafficher();
  } catch (e) {
    alert('Erreur : ' + e.message);
  }
}

async function lierAParent(playerId) {
  const parentUid = document.getElementById('parent-select-' + playerId).value;
  if (!parentUid) return;
  try {
    await updateDoc(doc(db, 'players', playerId), { parent_uids: arrayUnion(parentUid) });
    await updateDoc(doc(db, 'users', parentUid), { children_player_ids: arrayUnion(playerId) });
    await rafraichirEtReafficher();
  } catch (e) {
    alert("Erreur lors de l'association : " + e.message);
  }
}

async function ajouterJoueurRapide(teamId) {
  const prenom = document.getElementById('prenom-rapide-' + teamId).value.trim();
  const nom = document.getElementById('nom-rapide-' + teamId).value.trim();
  const $msg = document.getElementById('msg-gestion-' + teamId);
  if (!prenom) { $msg.className = 'msg err'; $msg.textContent = 'Le prénom est obligatoire.'; return; }
  try {
    await assurerEquipeExiste(teamId);
    await addDoc(collection(db, 'players'), {
      club_id: String(monClubId),
      team_id: String(teamId),
      account_uid: '',
      parent_uids: [],
      prenom, nom,
      created_at: serverTimestamp(),
    });
    $msg.className = 'msg ok'; $msg.textContent = '✅ Joueur ajouté.';
    await rafraichirEtReafficher();
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
}

async function deplacerSelection(teamId) {
  const cibles = [...document.querySelectorAll('.case-joueur-' + teamId + ':checked')].map(c => c.value);
  const nouvelleEquipe = document.getElementById('cible-bulk-' + teamId).value;
  const $msg = document.getElementById('msg-gestion-' + teamId);
  if (cibles.length === 0) { $msg.className = 'msg err'; $msg.textContent = 'Sélectionne au moins un joueur.'; return; }
  if (!nouvelleEquipe) { $msg.className = 'msg err'; $msg.textContent = 'Choisis une équipe de destination.'; return; }
  try {
    await assurerEquipeExiste(nouvelleEquipe);
    await Promise.all(cibles.map(id => updateDoc(doc(db, 'players', id), { team_id: String(nouvelleEquipe) })));
    $msg.className = 'msg ok'; $msg.textContent = `✅ ${cibles.length} joueur(s) déplacé(s).`;
    await rafraichirEtReafficher();
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
}


async function chargerMembres() {
  const q = query(collection(db, 'users'), where('club_id', '==', String(monClubId)));
  const snap = await getDocs(q);
  const $corps = document.getElementById('corps-membres');
  const LABEL_ROLE = { coach: 'Coach', player: 'Joueur', parent: 'Parent', club_admin: 'Admin club' };

  const membres = snap.docs
    .map(d => ({ uid: d.id, ...d.data() }))
    .filter(m => m.role !== 'club_admin');

  if (membres.length === 0) {
    $corps.innerHTML = '<p class="vide">Aucun membre pour le moment.</p>';
    return;
  }

  $corps.innerHTML = membres.map(m => `
    <div class="rangee">
      ${avatarHtml(m.photo_url, nomAffichage(m), 38)}
      <div>
        <div class="nom">${nomAffichage(m)}</div>
        <div class="sous-texte">${m.email} · ${LABEL_ROLE[m.role] || m.role}</div>
      </div>
      <div class="action"><button class="btn-ghost" data-uid="${m.uid}">Retirer l'accès</button></div>
    </div>
  `).join('');

  $corps.querySelectorAll('[data-uid]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm("Retirer l'accès de ce membre à l'espace club ? (son compte de connexion reste actif, mais il perd tout accès aux données du club)")) return;
      await deleteDoc(doc(db, 'users', btn.dataset.uid));
      await chargerMembres();
      await rafraichirEtReafficher();
    });
  });
}

async function chargerInvitations() {
  const q = query(collection(db, 'invitations'), where('club_id', '==', String(monClubId)));
  const snap = await getDocs(q);
  const $corps = document.getElementById('corps-invitations');
  if (snap.empty) {
    $corps.innerHTML = '<p class="vide">Aucune invitation pour le moment.</p>';
    return;
  }
  const LABEL_ROLE = { club_admin: 'Admin club', coach: 'Coach', player: 'Joueur', parent: 'Parent' };
  $corps.innerHTML = [...snap.docs]
    .sort((a, b) => (b.data().created_at?.seconds || 0) - (a.data().created_at?.seconds || 0))
    .map(d => {
      const inv = d.data();
      return `
        <div class="rangee">
          <div>
            <div class="nom">${d.id}</div>
            <div class="sous-texte">${LABEL_ROLE[inv.role] || inv.role}</div>
          </div>
          <div class="action" style="display:flex;gap:8px;align-items:center;">
            <span class="badge ${inv.status === 'used' ? 'badge-success' : 'badge-warning'}">${inv.status === 'used' ? 'Utilisée' : 'En attente'}</span>
            <button class="btn-ghost" data-inv="${d.id}">Supprimer</button>
          </div>
        </div>
      `;
    }).join('');

  $corps.querySelectorAll('[data-inv]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm(`Supprimer l'invitation pour ${btn.dataset.inv} ? Si elle n'a jamais été utilisée, ça ne supprime aucun compte, juste l'entrée en attente.`)) return;
      await deleteDoc(doc(db, 'invitations', btn.dataset.inv));
      await chargerInvitations();
    });
  });
}
</script>

</body>
</html>
