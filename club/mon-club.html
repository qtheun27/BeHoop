<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon Club — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .joueur-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .dropdown-menu { display: none; position: absolute; right: 0; top: 25px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-md); z-index: 50; min-width: 190px; }
  .dropdown-menu.ouvert { display: block; }
  .dropdown-menu a { display: block; padding: 8px 12px; font-size: 12px; color: var(--text); text-decoration: none; }
  .dropdown-menu a:hover { background: var(--surface-2); }
</style>
</head>
<body>
<div class="container" style="padding-top:16px;">

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-equipes">🏀 Équipes & Joueurs</button>
    <button class="tab-btn" data-tab="tab-calendrier">📅 Calendrier Club</button>
  </div>

  <!-- ONGLET 1 : ÉQUIPES & JOUEURS -->
  <div id="tab-equipes" class="tab-content active">
    <div class="carte">
      <div class="carte-titre">Gestion de l'équipe</div>
      <div class="puces" id="tabs-equipes"></div>
      
      <div style="margin-top:14px;">
        <label class="champ-label">Inviter un nouveau joueur</label>
        <div class="grille-2">
          <input type="text" id="j-prenom" placeholder="Prénom">
          <input type="text" id="j-nom" placeholder="Nom">
        </div>
        <input type="email" id="j-email" placeholder="email@joueur.be" style="margin-top:6px;">
        <button class="btn btn-primary" id="btn-inviter-joueur" style="margin-top:10px;">Envoyer l'invitation</button>
        <div class="msg" id="msg-inv-joueur"></div>
      </div>

      <div id="liste-joueurs-equipe" style="margin-top:16px;"><p class="vide">Chargement…</p></div>
    </div>
  </div>

  <!-- ONGLET 2 : CALENDRIER CLUB -->
  <div id="tab-calendrier" class="tab-content">
    <div class="carte">
      <div class="carte-titre">Programmer un événement</div>
      
      <label class="champ-label">Équipe ciblée</label>
      <select id="cal-target-team">
        <option value="all">Toutes les équipes du club</option>
      </select>

      <label class="champ-label">Type</label>
      <select id="cal-type">
        <option value="entrainement">🏋️ Entraînement</option>
        <option value="match">🏀 Match</option>
        <option value="evenement">📅 Événement</option>
      </select>

      <div class="grille-2" style="margin-top:6px;">
        <div><label class="champ-label">Date</label><input type="date" id="cal-date"></div>
        <div><label class="champ-label">Heure</label><input type="time" id="cal-heure" value="18:00"></div>
      </div>

      <label class="champ-label" style="margin-top:6px;">Lieu</label>
      <input type="text" id="cal-lieu" placeholder="Salle / Adresse">

      <button class="btn btn-primary" id="btn-save-cal" style="margin-top:12px;">Ajouter au calendrier</button>
      <div class="msg" id="msg-cal"></div>
    </div>
  </div>

</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs, query, where, updateDoc, arrayUnion, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml, nomAffichage } from "./avatar.js";
import { rendreNav, rendreNavImmediat, rendreEntete } from "./nav.js";

rendreEntete('Mon Club');
rendreNavImmediat('espace');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let monProfil = null;
let clubEquipes = [];
let equipeActive = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'club_admin') { window.location.href = './dashboard.html'; return; }
  
  monProfil = snap.data();
  rendreNav('club_admin', 'espace');

  await chargerEquipesClub();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

async function chargerEquipesClub() {
  const res = await fetch('../data.json?t=' + Date.now());
  const donnees = await res.json();
  const club = (donnees.clubs || []).find(c => String(c.id) === String(monProfil.club_id));
  clubEquipes = club ? (club.teams || []) : [];

  const $select = document.getElementById('cal-target-team');
  document.getElementById('tabs-equipes').innerHTML = clubEquipes.map((eq, i) => {
    const opt = document.createElement('option');
    opt.value = String(eq.id);
    opt.textContent = eq.category || eq.name;
    $select.appendChild(opt);

    return `<button class="puce ${i === 0 ? 'actif' : ''}" data-id="${eq.id}">${eq.category || eq.name}</button>`;
  }).join('');

  document.querySelectorAll('#tabs-equipes .puce').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tabs-equipes .puce').forEach(b => b.classList.remove('actif'));
      btn.classList.add('actif');
      equipeActive = btn.dataset.id;
      chargerJoueursEquipe();
    });
  });

  if (clubEquipes.length > 0) {
    equipeActive = String(clubEquipes[0].id);
    chargerJoueursEquipe();
  }
}

async function chargerJoueursEquipe() {
  const $liste = document.getElementById('liste-joueurs-equipe');
  $liste.innerHTML = 'Chargement…';

  const q = query(collection(db, 'players'), where('team_id', '==', equipeActive));
  const snap = await getDocs(q);

  if (snap.empty) {
    $liste.innerHTML = '<p class="vide">Aucun joueur dans cette équipe.</p>';
    return;
  }

  $liste.innerHTML = snap.docs.map(d => {
    const j = { id: d.id, ...d.data() };
    return `
      <div class="joueur-item">
        <div style="display:flex;align-items:center;gap:10px;">
          ${avatarHtml(j.photo_url, nomAffichage(j), 36)}
          <div>
            <div style="font-weight:700;">${nomAffichage(j)}</div>
            <div style="font-size:11.5px;color:var(--text-muted);">${j.email || 'Pas d\'email'}</div>
          </div>
        </div>
        
        <div style="position:relative;">
          <button class="btn-ghost" onclick="window.__toggleMenuJoueur('${j.id}')">⋮</button>
          <div class="dropdown-menu" id="menu-j-${j.id}">
            <a href="#" onclick="window.__editerJoueur('${j.id}'); return false;">✏️ Modifier infos / email</a>
            <a href="#" onclick="window.__associerParent('${j.id}'); return false;">👨‍👩‍👧 Associer à un parent</a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

window.__toggleMenuJoueur = (id) => {
  document.querySelectorAll('.dropdown-menu.ouvert').forEach(m => {
    if (m.id !== 'menu-j-' + id) m.classList.remove('ouvert');
  });
  document.getElementById('menu-j-' + id)?.classList.toggle('ouvert');
};

document.addEventListener('click', e => {
  if (!e.target.closest('.joueur-item')) {
    document.querySelectorAll('.dropdown-menu.ouvert').forEach(m => m.classList.remove('ouvert'));
  }
});

// Modification des données tout en CONSERVANT le document 'players/{id}' (préserve les statistiques)
window.__editerJoueur = async (playerId) => {
  const pSnap = await getDoc(doc(db, 'players', playerId));
  if (!pSnap.exists()) return;
  const p = pSnap.data();

  const prenom = prompt("Prénom :", p.prenom || '')?.trim();
  const nom = prompt("Nom :", p.nom || '')?.trim();
  const email = prompt("Nouvel email (renvoie une invitation) :", p.email || '')?.trim().toLowerCase();

  if (prenom && email) {
    await updateDoc(doc(db, 'players', playerId), { prenom, nom: nom || '', email });

    // Si un ancien compte user existait, on le détache pour forcer l'utilisation du nouvel email
    if (p.account_uid) {
      await deleteDoc(doc(db, 'users', p.account_uid));
      await updateDoc(doc(db, 'players', playerId), { account_uid: '' });
    }

    await setDoc(doc(db, 'invitations', email), {
      role: 'player',
      club_id: monProfil.club_id,
      team_id: equipeActive,
      player_id: playerId,
      status: 'pending',
      created_at: serverTimestamp()
    });

    alert("Mise à jour effectuée et nouvelle invitation transmise à " + email);
    await chargerJoueursEquipe();
  }
};

window.__associerParent = async (playerId) => {
  const emailParent = prompt("Email du compte parent :")?.trim().toLowerCase();
  if (!emailParent) return;

  const q = query(collection(db, 'users'), where('email', '==', emailParent));
  const snap = await getDocs(q);

  if (snap.empty) {
    alert("Aucun compte parent trouvé. Veuillez d'abord l'inviter.");
    return;
  }

  const parentUid = snap.docs[0].id;
  await updateDoc(doc(db, 'players', playerId), { parent_uids: arrayUnion(parentUid) });
  await updateDoc(doc(db, 'users', parentUid), { children_player_ids: arrayUnion(playerId) });

  alert("Rapprochement effectué avec succès !");
};

document.getElementById('btn-save-cal').addEventListener('click', async () => {
  const $msg = document.getElementById('msg-cal');
  const target = document.getElementById('cal-target-team').value;
  const type = document.getElementById('cal-type').value;
  const date = document.getElementById('cal-date').value;
  const heure = document.getElementById('cal-heure').value;
  const lieu = document.getElementById('cal-lieu').value.trim();

  if (!date) { $msg.className = 'msg err'; $msg.textContent = 'Indiquez une date.'; return; }

  try {
    const teamsToApply = target === 'all' ? clubEquipes.map(e => String(e.id)) : [target];
    
    for (const tid of teamsToApply) {
      await addDoc(collection(db, 'trainings'), {
        team_id: tid, type, date, start_time: heure, location: lieu,
        club_id: monProfil.club_id, created_by: auth.currentUser.uid, created_at: serverTimestamp()
      });
    }

    $msg.className = 'msg ok'; $msg.textContent = '✅ Événement ajouté !';
    document.getElementById('cal-date').value = '';
    document.getElementById('cal-lieu').value = '';
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
});
</script>
</body>
</html>
