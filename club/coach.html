<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon équipe — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .entrainement { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 6px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
  .joueur-stat { border-bottom: 1px solid var(--border-soft); padding: 14px 0; }
  .joueur-stat:first-child { padding-top: 4px; }
  .joueur-stat:last-child { border-bottom: none; }
  .joueur-nom { font-weight: 700; font-size: 13.5px; }
  .joueur-entete { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ligne-position { display: flex; gap: 8px; align-items: center; margin-top: 8px; margin-bottom: 4px; }
  .badge-position { display: inline-block; background: var(--surface-2); color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
  table.historique, table.resume { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.historique th, table.historique td, table.resume th, table.resume td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--border-soft); }
  table.historique td:first-child, table.historique th:first-child, table.resume td:first-child, table.resume th:first-child { text-align: left; }
</style>
</head>
<body>
<div class="container" style="padding-top:16px;">

  <div class="puces" id="tabs-equipes"></div>

  <div class="carte">
    <div class="carte-titre" id="titre-form-entrainement">Ajouter au calendrier</div>

    <label class="champ-label">Type</label>
    <div class="segmente" id="segmente-type" style="margin-bottom:10px;">
      <button type="button" class="actif" data-type="entrainement">Entraînement</button>
      <button type="button" data-type="match">Match</button>
      <button type="button" data-type="tournoi">Tournoi</button>
      <button type="button" data-type="evenement">Événement</button>
    </div>

    <div class="grille-2">
      <div><label class="champ-label">Date</label><input type="date" id="ent-date"></div>
      <div><label class="champ-label">Heure</label><input type="time" id="ent-heure" value="18:00"></div>
    </div>

    <label class="champ-label" style="margin-top:8px;">Lieu</label>
    <input type="text" id="ent-lieu" list="liste-salles" placeholder="Nom de la salle ou adresse...">
    <datalist id="liste-salles"></datalist>

    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;">
      <input type="checkbox" id="ent-recurrent" style="width:17px;height:17px;">
      Répéter chaque semaine
    </label>
    <div id="zone-recurrence" style="display:none;margin-top:8px;">
      <label class="champ-label">Jusqu'au</label>
      <input type="date" id="ent-fin-recurrence">
    </div>

    <label class="champ-label" style="margin-top:8px;">Notes (optionnel)</label>
    <textarea id="ent-notes" rows="2"></textarea>

    <div style="display:flex;align-items:center;gap:14px;margin-top:14px;">
      <button class="btn btn-primary" id="btn-save-ent">Ajouter</button>
      <button class="btn-ghost" id="btn-annuler-edit" style="display:none;">Annuler</button>
    </div>
    <div class="msg" id="msg-ent"></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Calendrier de l'équipe</div>
    <div class="puces" id="filtres-agenda" style="margin-bottom:10px;">
      <button class="filtre-chip active" data-filtre="avenir">À venir</button>
      <button class="filtre-chip" data-filtre="passes">Passés</button>
      <button class="filtre-chip" data-filtre="tous">Tous</button>
    </div>
    <div id="liste-entrainements"><p class="vide">Sélectionne une équipe ci-dessus.</p></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Résumé de l'équipe</div>
    <div id="resume-equipe"><p class="vide">Sélectionne une équipe ci-dessus.</p></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Statistiques des joueurs</div>
    <div id="liste-joueurs"><p class="vide">Sélectionne une équipe ci-dessus.</p></div>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { rendreNav, rendreNavImmediat, rendreEntete } from "./nav.js";
import { avatarHtml, nomAffichage } from "./avatar.js";

rendreEntete('Mon équipe');
rendreNavImmediat('espace');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let monProfil = null;
let mesEquipes = [];
let joueursEquipe = [];
let equipeActive = null;
let entrainementEnEdition = null;
let typeAgendaActif = 'entrainement';
let filtreAgenda = 'avenir';

const TYPES_AGENDA = {
  entrainement: { label: 'Entraînement', emoji: '🏋️', couleur: 'var(--primary)' },
  match:        { label: 'Match',        emoji: '🏀', couleur: 'var(--orange)' },
  tournoi:      { label: 'Tournoi',      emoji: '🏆', couleur: '#b45309' },
  evenement:    { label: 'Événement',    emoji: '📅', couleur: 'var(--text-muted)' },
};

function formatDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('fr-BE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}

// CORRECTION BUG MENU COUPE : Affiche les liens directement dans le flux (inline) au lieu d'un menu absolu
function liensItineraire(lieu, id) {
  if (!lieu) return '';
  const q = encodeURIComponent(lieu);
  return `
    <div class="game-venue" style="margin-top:6px;">
      <button class="venue-btn" onclick="window.__menuLieu('${id}')" style="display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);padding:6px 10px;border-radius:20px;border:1px solid var(--border);">
        📍 ${lieu} <span style="font-size:10px;">▼</span>
      </button>
      <div id="venue-menu-${id}" style="display:none; gap:6px; margin-top:8px; flex-wrap:wrap;">
        <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" class="badge badge-muted" style="text-decoration:none;">Google Maps</a>
        <a href="https://waze.com/ul?q=${q}&navigate=yes" target="_blank" rel="noopener" class="badge badge-muted" style="text-decoration:none;">Waze</a>
        <a href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener" class="badge badge-muted" style="text-decoration:none;">Plans (Apple)</a>
      </div>
    </div>
  `;
}

window.__menuLieu = (id) => {
  const leMenu = document.getElementById('venue-menu-' + id);
  if (leMenu.style.display === 'none') {
    leMenu.style.display = 'flex';
  } else {
    leMenu.style.display = 'none';
  }
};

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'coach') { window.location.href = './dashboard.html'; return; }
  rendreNav('coach', 'espace');

  monProfil = snap.data();

  const res = await fetch('../data.json?t=' + Date.now());
  const donnees = await res.json();
  const club = (donnees.clubs || []).find(c => String(c.id) === String(monProfil.club_id));
  const toutesEquipes = club ? (club.teams || []) : [];
  mesEquipes = toutesEquipes.filter(eq => (monProfil.team_ids || []).includes(String(eq.id)) || (monProfil.team_ids || []).includes(eq.id));

  if (mesEquipes.length === 0) {
    document.getElementById('tabs-equipes').innerHTML = '<p class="vide">Aucune équipe ne t\'a encore été assignée.</p>';
    return;
  }

  document.getElementById('tabs-equipes').innerHTML = mesEquipes.map((eq, i) => `
    <button class="puce ${i === 0 ? 'actif' : ''}" data-id="${eq.id}">${eq.category || eq.name}</button>
  `).join('');
  document.querySelectorAll('#tabs-equipes .puce').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tabs-equipes .puce').forEach(b => b.classList.remove('actif'));
      btn.classList.add('actif');
      selectionnerEquipe(btn.dataset.id);
    });
  });
  selectionnerEquipe(mesEquipes[0].id);
});

async function selectionnerEquipe(teamId) {
  equipeActive = String(teamId);
  annulerEdition();
  await chargerEntrainements();
  await chargerJoueurs();
  await chargerResumeEquipe();
}

document.querySelectorAll('#segmente-type button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#segmente-type button').forEach(b => b.classList.remove('actif'));
    btn.classList.add('actif');
    typeAgendaActif = btn.dataset.type;
  });
});

document.getElementById('ent-recurrent').addEventListener('change', (e) => {
  document.getElementById('zone-recurrence').style.display = e.target.checked ? 'block' : 'none';
});

document.querySelectorAll('#filtres-agenda .filtre-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#filtres-agenda .filtre-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtreAgenda = btn.dataset.filtre;
    chargerEntrainements();
  });
});

async function chargerEntrainements() {
  const $liste = document.getElementById('liste-entrainements');
  if (!equipeActive) return;
  $liste.innerHTML = 'Chargement…';
  const q = query(collection(db, 'trainings'), where('team_id', '==', equipeActive));
  const snap = await getDocs(q);

  const aujourdhui = new Date().toISOString().slice(0, 10);
  let items = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.date + (a.start_time || '')).localeCompare(b.date + (b.start_time || '')));

  if (filtreAgenda === 'avenir') items = items.filter(t => t.date >= aujourdhui);
  else if (filtreAgenda === 'passes') items = items.filter(t => t.date < aujourdhui).reverse();

  if (items.length === 0) {
    $liste.innerHTML = '<p class="vide">Rien de programmé dans cette catégorie.</p>';
    return;
  }

  $liste.innerHTML = items.map(t => {
    const type = TYPES_AGENDA[t.type] || TYPES_AGENDA.entrainement;
    return `
      <div class="entrainement" style="border-left:3px solid ${type.couleur};">
        <div style="flex:1;min-width:0;">
          <div style="font-size:11.5px;font-weight:700;color:${type.couleur};">${type.emoji} ${type.label}</div>
          <div style="font-weight:700;">${formatDate(t.date)} · ${t.start_time || ''}</div>
          ${t.location ? liensItineraire(t.location, t.id) : ''}
          ${t.notes ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${t.notes}</div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
          <button class="btn-ghost" onclick="window.__editerEnt('${t.id}')">Modifier</button>
          <button class="btn-ghost" onclick="window.__supprimerEnt('${t.id}')">Supprimer</button>
        </div>
      </div>
    `;
  }).join('');

  window.__editerEnt = (id) => {
    const t = items.find(x => x.id === id);
    entrainementEnEdition = id;
    typeAgendaActif = t.type || 'entrainement';
    document.querySelectorAll('#segmente-type button').forEach(b => b.classList.toggle('actif', b.dataset.type === typeAgendaActif));
    document.getElementById('ent-date').value = t.date || '';
    document.getElementById('ent-heure').value = t.start_time || '';
    document.getElementById('ent-lieu').value = t.location || '';
    document.getElementById('ent-notes').value = t.notes || '';
    document.getElementById('titre-form-entrainement').textContent = 'Modifier';
    document.getElementById('btn-save-ent').textContent = 'Enregistrer';
    document.getElementById('btn-annuler-edit').style.display = 'inline';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.__supprimerEnt = async (id) => {
    if (!confirm('Supprimer cet élément ?')) return;
    await deleteDoc(doc(db, 'trainings', id));
    await chargerEntrainements();
  };
}

function annulerEdition() {
  entrainementEnEdition = null;
  typeAgendaActif = 'entrainement';
  document.querySelectorAll('#segmente-type button').forEach(b => b.classList.toggle('actif', b.dataset.type === 'entrainement'));
  document.getElementById('ent-date').value = '';
  document.getElementById('ent-heure').value = '18:00';
  document.getElementById('ent-lieu').value = '';
  document.getElementById('ent-notes').value = '';
  document.getElementById('ent-recurrent').checked = false;
  document.getElementById('zone-recurrence').style.display = 'none';
  document.getElementById('titre-form-entrainement').textContent = 'Ajouter au calendrier';
  document.getElementById('btn-save-ent').textContent = 'Ajouter';
  document.getElementById('btn-annuler-edit').style.display = 'none';
}
document.getElementById('btn-annuler-edit').addEventListener('click', annulerEdition);

document.getElementById('btn-save-ent').addEventListener('click', async () => {
  const $msg = document.getElementById('msg-ent');
  const date = document.getElementById('ent-date').value;
  const heure = document.getElementById('ent-heure').value;
  const lieu = document.getElementById('ent-lieu').value.trim();
  const notes = document.getElementById('ent-notes').value.trim();
  const recurrent = document.getElementById('ent-recurrent').checked;
  const finRecurrence = document.getElementById('ent-fin-recurrence').value;

  if (!date || !equipeActive) {
    $msg.className = 'msg err'; $msg.textContent = 'Choisissez au moins une date.'; return;
  }

  try {
    const base = { team_id: equipeActive, type: typeAgendaActif, start_time: heure, location: lieu, notes, updated_at: serverTimestamp() };

    if (entrainementEnEdition) {
      await setDoc(doc(db, 'trainings', entrainementEnEdition), { ...base, date }, { merge: true });
    } else if (recurrent && finRecurrence) {
      let d = new Date(date + 'T12:00:00');
      const fin = new Date(finRecurrence + 'T12:00:00');
      while (d <= fin) {
        await addDoc(collection(db, 'trainings'), { ...base, date: d.toISOString().slice(0, 10), created_by: auth.currentUser.uid, created_at: serverTimestamp() });
        d.setDate(d.getDate() + 7);
      }
    } else {
      await addDoc(collection(db, 'trainings'), { ...base, date, created_by: auth.currentUser.uid, created_at: serverTimestamp() });
    }

    $msg.className = 'msg ok'; $msg.textContent = '✅ Enregistré.';
    annulerEdition();
    await chargerEntrainements();
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
});

const POSITIONS = { meneur: 'Meneur (1)', arriere: 'Arrière (2)', ailier: 'Ailier (3)', ailier_fort: 'Ailier fort (4)', pivot: 'Pivot (5)' };

async function chargerJoueurs() {
  const $liste = document.getElementById('liste-joueurs');
  $liste.innerHTML = 'Chargement…';
  const q = query(collection(db, 'players'), where('team_id', '==', equipeActive));
  const snap = await getDocs(q);
  if (snap.empty) { $liste.innerHTML = '<p class="vide">Aucun joueur dans cette équipe.</p>'; joueursEquipe = []; return; }
  joueursEquipe = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  $liste.innerHTML = joueursEquipe.map(j => `
    <div class="joueur-stat">
      <div class="joueur-entete">
        ${avatarHtml(j.photo_url, nomAffichage(j), 36)}
        <div>
          <div class="joueur-nom">${nomAffichage(j)}${j.position ? `<span class="badge-position">${POSITIONS[j.position] || j.position}</span>` : ''}</div>
        </div>
      </div>
      <div class="ligne-position">
        <select id="position-${j.id}">
          <option value="">Position sur le terrain...</option>
          ${Object.entries(POSITIONS).map(([val, label]) => `<option value="${val}" ${j.position === val ? 'selected' : ''}>${label}</option>`).join('')}
        </select>
        <button class="btn-ghost" onclick="window.__enregistrerPosition('${j.id}')">Enregistrer</button>
      </div>
      <div class="grille-2" style="margin-top:8px;">
        <input type="date" id="stat-date-${j.id}">
        <select id="stat-type-${j.id}"><option value="match">Match</option><option value="entrainement">Entraînement</option></select>
      </div>
      <div class="grille-2" style="margin-top:6px;">
        <input type="number" id="stat-points-${j.id}" placeholder="Points" min="0">
        <input type="number" id="stat-rebonds-${j.id}" placeholder="Rebonds" min="0">
      </div>
      <div class="grille-2" style="margin-top:6px;">
        <input type="number" id="stat-passes-${j.id}" placeholder="Passes" min="0">
        <input type="number" id="stat-minutes-${j.id}" placeholder="Minutes" min="0">
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="window.__ajouterStat('${j.id}')">Ajouter la statistique</button>
      <div class="msg" id="msg-stat-${j.id}"></div>
    </div>
  `).join('');

  window.__ajouterStat = async (playerId) => {
    const date = document.getElementById('stat-date-' + playerId).value;
    if (!date) return;
    await addDoc(collection(db, 'player_stats'), {
      player_id: playerId, team_id: equipeActive, date,
      type: document.getElementById('stat-type-' + playerId).value,
      points: Number(document.getElementById('stat-points-' + playerId).value || 0),
      rebonds: Number(document.getElementById('stat-rebonds-' + playerId).value || 0),
      passes: Number(document.getElementById('stat-passes-' + playerId).value || 0),
      minutes: Number(document.getElementById('stat-minutes-' + playerId).value || 0),
      created_by: auth.currentUser.uid, created_at: serverTimestamp(),
    });
    await chargerResumeEquipe();
  };

  window.__enregistrerPosition = async (playerId) => {
    const position = document.getElementById('position-' + playerId).value;
    await setDoc(doc(db, 'players', playerId), { position }, { merge: true });
    await chargerJoueurs();
  };
}

async function chargerResumeEquipe() {
  const $cible = document.getElementById('resume-equipe');
  if (joueursEquipe.length === 0) { $cible.innerHTML = '<p class="vide">Aucun joueur.</p>'; return; }

  const q = query(collection(db, 'player_stats'), where('team_id', '==', equipeActive));
  const snap = await getDocs(q);
  const parJoueur = {};
  snap.forEach(d => {
    const s = d.data();
    parJoueur[s.player_id] = parJoueur[s.player_id] || { matchs: 0, points: 0, rebonds: 0, passes: 0 };
    const c = parJoueur[s.player_id];
    c.matchs++; c.points += s.points || 0; c.rebonds += s.rebonds || 0; c.passes += s.passes || 0;
  });

  $cible.innerHTML = `
    <table class="resume">
      <thead><tr><th>Joueur</th><th>M</th><th>Pts/m</th><th>Reb/m</th><th>Pas/m</th></tr></thead>
      <tbody>${joueursEquipe.map(j => {
        const c = parJoueur[j.id] || { matchs: 0, points: 0, rebonds: 0, passes: 0 };
        const moy = (v) => c.matchs ? (v / c.matchs).toFixed(1) : '—';
        return `<tr><td>${nomAffichage(j)}</td><td>${c.matchs}</td><td>${moy(c.points)}</td><td>${moy(c.rebonds)}</td><td>${moy(c.passes)}</td></tr>`;
      }).join('')}</tbody>
    </table>
  `;
}
</script>
</body>
</html>
