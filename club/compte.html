<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeHoop">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<title>Mon compte — Espace Club</title>
<link rel="stylesheet" href="./styles.css">
<style>
  .zone-photo { text-align: center; padding: 6px 0 4px; }
  .zone-photo .avatar { margin: 0 auto 10px; }
  .zone-photo input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="app-bar">
  <a class="retour" href="./dashboard.html">←</a>
  <span class="titre">⚙️ Mon compte</span>
</div>
<div class="container" style="padding-top:18px;">

  <div class="carte zone-photo">
    <div class="carte-titre" style="justify-content:center;">Photo de profil</div>
    <div class="carte-desc" style="text-align:center;">Visible par les autres membres de ton club.</div>
    <div id="apercu-photo"></div>
    <input type="file" accept="image/*" id="fichier-photo">
    <button class="btn btn-secondary" style="margin-top:6px;" id="btn-choisir-photo">Choisir une photo</button>
    <div class="msg" id="msg-photo"></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Identité</div>
    <div class="carte-desc">Ton prénom (et l'initiale de ton nom) seront visibles par les autres membres de ton club, à la place de ton email.</div>
    <div class="grille-2">
      <div><label class="champ-label">Prénom</label><input type="text" id="mon-prenom"></div>
      <div><label class="champ-label">Nom</label><input type="text" id="mon-nom"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:14px;" id="btn-identite">Enregistrer</button>
    <div class="msg" id="msg-identite"></div>
  </div>

  <div class="carte">
    <div class="carte-titre">Email</div>
    <p style="color:var(--text-muted);font-size:14px;margin:0;" id="mon-email"></p>
  </div>

  <div class="carte">
    <div class="carte-titre" id="titre-mdp">Mot de passe</div>
    <div class="carte-desc" id="desc-mdp"></div>
    <label class="champ-label">Nouveau mot de passe</label>
    <input type="password" id="nouveau-mdp" autocomplete="new-password">
    <label class="champ-label">Confirmer le mot de passe</label>
    <input type="password" id="confirmer-mdp" autocomplete="new-password">
    <button class="btn btn-primary" style="margin-top:14px;" id="btn-mdp">Enregistrer</button>
    <div class="msg" id="msg-mdp"></div>
  </div>
</div>
<footer class="pied">BeHoop — Espace Club</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, updatePassword, linkWithCredential, EmailAuthProvider,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { avatarHtml, comprimerPhoto } from "./avatar.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let aDejaUnMotDePasse = false;
let monNom = '';

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  document.getElementById('mon-email').textContent = user.email;

  const snap = await getDoc(doc(db, 'users', user.uid));
  const profil = snap.exists() ? snap.data() : {};
  monNom = profil.display_name || user.email;
  document.getElementById('apercu-photo').innerHTML = avatarHtml(profil.photo_url, monNom, 88);
  document.getElementById('mon-prenom').value = profil.prenom || '';
  document.getElementById('mon-nom').value = profil.nom || '';

  aDejaUnMotDePasse = user.providerData.some(p => p.providerId === 'password');
  if (aDejaUnMotDePasse) {
    document.getElementById('titre-mdp').textContent = 'Changer mon mot de passe';
    document.getElementById('desc-mdp').textContent = 'Choisis un nouveau mot de passe pour te connecter directement la prochaine fois.';
  } else {
    document.getElementById('titre-mdp').textContent = 'Créer un mot de passe';
    document.getElementById('desc-mdp').textContent = "Tu t'es connecté(e) via un lien reçu par email. Définis un mot de passe si tu préfères te connecter directement.";
  }

  const ROUTE_ROLE = { super_admin: './admin.html', club_admin: './mon-club.html', coach: './coach.html', player: './joueur.html', parent: './parent.html' };
  const ICONE_ROLE = { super_admin: '🛠️', club_admin: '🏀', coach: '🏀', player: '🏀', parent: '👨‍👩‍👧' };
  document.getElementById('nav-espace').innerHTML = ROUTE_ROLE[profil.role]
    ? `<a href="${ROUTE_ROLE[profil.role]}"><span class="icone-nav">${ICONE_ROLE[profil.role]}</span>Mon espace</a>`
    : '';
});

document.getElementById('btn-choisir-photo').addEventListener('click', () => document.getElementById('fichier-photo').click());
document.getElementById('fichier-photo').addEventListener('change', async (e) => {
  const fichier = e.target.files[0];
  const $msg = document.getElementById('msg-photo');
  if (!fichier) return;
  try {
    const dataUri = await comprimerPhoto(fichier);
    document.getElementById('apercu-photo').innerHTML = avatarHtml(dataUri, monNom, 88);
    await setDoc(doc(db, 'users', auth.currentUser.uid), { photo_url: dataUri }, { merge: true });
    $msg.className = 'msg ok'; $msg.textContent = '✅ Photo mise à jour.';
  } catch (err) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + err.message;
  }
});

document.getElementById('btn-identite').addEventListener('click', async () => {
  const prenom = document.getElementById('mon-prenom').value.trim();
  const nom = document.getElementById('mon-nom').value.trim();
  const $msg = document.getElementById('msg-identite');
  if (!prenom) { $msg.className = 'msg err'; $msg.textContent = 'Le prénom est obligatoire.'; return; }
  try {
    await setDoc(doc(db, 'users', auth.currentUser.uid), { prenom, nom }, { merge: true });
    monNom = nom ? `${prenom} ${nom}` : prenom;
    $msg.className = 'msg ok'; $msg.textContent = '✅ Enregistré.';
  } catch (e) {
    $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
  }
});

document.getElementById('btn-mdp').addEventListener('click', async () => {
  const mdp1 = document.getElementById('nouveau-mdp').value;
  const mdp2 = document.getElementById('confirmer-mdp').value;
  const $msg = document.getElementById('msg-mdp');

  if (mdp1.length < 6) { $msg.className = 'msg err'; $msg.textContent = 'Le mot de passe doit faire au moins 6 caractères.'; return; }
  if (mdp1 !== mdp2) { $msg.className = 'msg err'; $msg.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }

  try {
    const user = auth.currentUser;
    if (aDejaUnMotDePasse) {
      await updatePassword(user, mdp1);
    } else {
      await linkWithCredential(user, EmailAuthProvider.credential(user.email, mdp1));
      aDejaUnMotDePasse = true;
    }
    $msg.className = 'msg ok'; $msg.textContent = '✅ Mot de passe enregistré.';
    document.getElementById('nouveau-mdp').value = '';
    document.getElementById('confirmer-mdp').value = '';
  } catch (e) {
    if (e.code === 'auth/requires-recent-login') {
      $msg.className = 'msg err'; $msg.textContent = 'Pour ta sécurité, déconnecte-toi puis reconnecte-toi avant de changer ton mot de passe.';
    } else {
      $msg.className = 'msg err'; $msg.textContent = 'Erreur : ' + e.message;
    }
  }
});
</script>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="./dashboard.html"><span class="icone-nav">🏠</span>Accueil</a>
    <span id="nav-espace" style="display:contents;"></span>
    <a href="./compte.html" class="actif"><span class="icone-nav">⚙️</span>Compte</a>
  </div>
</nav>
</body>
</html>
