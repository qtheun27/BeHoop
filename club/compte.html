<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — Espace Club</title>
<style>
  :root { --primary: #0b5cab; --bg: #f2f4f8; --card: #fff; --text: #16202e; --muted: #64748b; --border: #e6e9ef; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
  .wrap { max-width: 400px; margin: auto; }
  a.retour { color: var(--muted); font-size: 13px; text-decoration: none; }
  h1 { font-size: 19px; margin: 10px 0 14px; }
  .carte { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .carte > strong { display: block; margin-bottom: 4px; }
  .desc { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  input[type="password"], input[type="email"] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 15px; }
  button { margin-top: 14px; padding: 11px 18px; background: var(--primary); color: white; border: none; border-radius: 9px; font-weight: 700; font-size: 14.5px; cursor: pointer; }
  .msg { font-size: 13px; margin-top: 10px; padding: 9px 12px; border-radius: 8px; display: none; }
  .msg.ok { background: #e8f6ee; color: #1f9d55; display: block; }
  .msg.err { background: #fdecea; color: #b3261e; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <a class="retour" href="./dashboard.html">← Retour au tableau de bord</a>
  <h1>⚙️ Mon compte</h1>

  <div class="carte">
    <strong>Email</strong>
    <p id="mon-email" style="color:var(--muted);font-size:14px;"></p>
  </div>

  <div class="carte">
    <strong id="titre-mdp">Mot de passe</strong>
    <div class="desc" id="desc-mdp"></div>
    <label>Nouveau mot de passe</label>
    <input type="password" id="nouveau-mdp" autocomplete="new-password">
    <label>Confirmer le mot de passe</label>
    <input type="password" id="confirmer-mdp" autocomplete="new-password">
    <button id="btn-mdp">Enregistrer</button>
    <div class="msg" id="msg-mdp"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, updatePassword, linkWithCredential, EmailAuthProvider,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let aDejaUnMotDePasse = false;

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = './index.html'; return; }
  document.getElementById('mon-email').textContent = user.email;

  aDejaUnMotDePasse = user.providerData.some(p => p.providerId === 'password');
  if (aDejaUnMotDePasse) {
    document.getElementById('titre-mdp').textContent = 'Changer mon mot de passe';
    document.getElementById('desc-mdp').textContent = 'Choisis un nouveau mot de passe pour te connecter directement la prochaine fois (sans repasser par un lien email).';
  } else {
    document.getElementById('titre-mdp').textContent = 'Créer un mot de passe';
    document.getElementById('desc-mdp').textContent = "Tu t'es connecté(e) via un lien reçu par email. Définis un mot de passe si tu préfères te connecter directement la prochaine fois.";
  }
});

document.getElementById('btn-mdp').addEventListener('click', async () => {
  const mdp1 = document.getElementById('nouveau-mdp').value;
  const mdp2 = document.getElementById('confirmer-mdp').value;
  const $msg = document.getElementById('msg-mdp');

  if (mdp1.length < 6) {
    $msg.className = 'msg err'; $msg.textContent = 'Le mot de passe doit faire au moins 6 caractères.'; return;
  }
  if (mdp1 !== mdp2) {
    $msg.className = 'msg err'; $msg.textContent = 'Les deux mots de passe ne correspondent pas.'; return;
  }

  try {
    const user = auth.currentUser;
    if (aDejaUnMotDePasse) {
      await updatePassword(user, mdp1);
    } else {
      const credential = EmailAuthProvider.credential(user.email, mdp1);
      await linkWithCredential(user, credential);
      aDejaUnMotDePasse = true;
    }
    $msg.className = 'msg ok';
    $msg.textContent = '✅ Mot de passe enregistré. Tu peux maintenant te connecter avec.';
    document.getElementById('nouveau-mdp').value = '';
    document.getElementById('confirmer-mdp').value = '';
  } catch (e) {
    if (e.code === 'auth/requires-recent-login') {
      $msg.className = 'msg err';
      $msg.textContent = 'Pour ta sécurité, reconnecte-toi (déconnexion puis nouvelle connexion) avant de changer ton mot de passe.';
    } else {
      $msg.className = 'msg err';
      $msg.textContent = 'Erreur : ' + e.message;
    }
  }
});
</script>
</body>
</html>
