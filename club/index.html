<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Espace Club — Basket Hainaut</title>
<link rel="stylesheet" href="./styles.css">
<style>
  body { display: flex; align-items: center; min-height: 100vh; padding: 24px 16px; }
  .logo { width: 56px; height: 56px; border-radius: 18px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 14px; }
  h1 { font-size: 21px; text-align: center; margin: 0 0 2px; }
  .sous-titre { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .separateur { text-align: center; color: var(--text-muted); font-size: 12px; margin: 16px 0 2px; }
  button.google {
    width: 100%; margin-top: 10px; padding: 11px; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .panneau { display: none; }
  .panneau.actif { display: block; }
</style>
</head>
<body>
<div class="container-sm" style="width:100%;">
  <div class="logo">🏀</div>
  <h1>Espace Club</h1>
  <div class="sous-titre">Basket Hainaut — accès réservé</div>

  <div class="carte">
    <div class="segmente">
      <button class="actif" data-panneau="connexion">Se connecter</button>
      <button data-panneau="inscription">Première connexion</button>
    </div>

    <div id="panneau-connexion" class="panneau actif">
      <label class="champ-label" for="c-email">Email</label>
      <input type="email" id="c-email" autocomplete="email">
      <label class="champ-label" for="c-mdp">Mot de passe</label>
      <input type="password" id="c-mdp" autocomplete="current-password">
      <button class="btn btn-primary btn-block" style="margin-top:16px;" id="btn-connexion">Se connecter</button>
      <div class="separateur">ou</div>
      <button class="google" id="btn-google-connexion">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h11.8c-.5 2.7-2.1 5-4.4 6.6v5.5h7.1c4.2-3.9 6.6-9.6 6.6-16.6z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.6-3.9-12.4-9.1H4.3v5.7C7.9 41 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.6 28.1c-.5-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1v-5.7H4.3C2.8 17.1 2 20.5 2 24s.8 6.9 2.3 9.8z"/><path fill="#EA4335" d="M24 10.7c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.1 30 2 24 2 15.3 2 7.9 7 4.3 14.2l7.3 5.7c1.8-5.2 6.6-9.2 12.4-9.2z"/></svg>
        Continuer avec Google
      </button>
      <p class="vide" style="margin-top:12px;">Pas encore de compte ? Utilise "Première connexion" si tu as reçu une invitation.</p>
    </div>

    <div id="panneau-inscription" class="panneau">
      <label class="champ-label" for="i-email">Email (celui de ton invitation)</label>
      <input type="email" id="i-email" autocomplete="email">
      <label class="champ-label" for="i-mdp">Choisis un mot de passe</label>
      <input type="password" id="i-mdp" autocomplete="new-password">
      <button class="btn btn-primary btn-block" style="margin-top:16px;" id="btn-inscription">Créer mon compte</button>
      <div class="separateur">ou</div>
      <button class="google" id="btn-google-inscription">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h11.8c-.5 2.7-2.1 5-4.4 6.6v5.5h7.1c4.2-3.9 6.6-9.6 6.6-16.6z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.6-3.9-12.4-9.1H4.3v5.7C7.9 41 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.6 28.1c-.5-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1v-5.7H4.3C2.8 17.1 2 20.5 2 24s.8 6.9 2.3 9.8z"/><path fill="#EA4335" d="M24 10.7c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.1 30 2 24 2 15.3 2 7.9 7 4.3 14.2l7.3 5.7c1.8-5.2 6.6-9.2 12.4-9.2z"/></svg>
        Continuer avec Google
      </button>
      <p class="vide" style="margin-top:12px;">Utilise exactement l'adresse email sur laquelle tu as reçu ton invitation.</p>
    </div>

    <div class="msg" id="msg-erreur"></div>
    <div class="msg" id="msg-info"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, signOut,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { reclamerInvitation, lireInvitationEnAttente } from "./invite-logic.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

const $erreur = document.getElementById('msg-erreur');
const $info = document.getElementById('msg-info');

function afficherErreur(texte) { $info.className = 'msg'; $erreur.className = 'msg err'; $erreur.textContent = texte; }
function afficherInfo(texte) { $erreur.className = 'msg'; $info.className = 'msg ok'; $info.textContent = texte; }

document.querySelectorAll('.segmente button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.segmente button').forEach(b => b.classList.remove('actif'));
    document.querySelectorAll('.panneau').forEach(p => p.classList.remove('actif'));
    btn.classList.add('actif');
    document.getElementById('panneau-' + btn.dataset.panneau).classList.add('actif');
    $erreur.className = 'msg'; $info.className = 'msg';
  });
});

async function apresConnexion(user, estPremiereConnexion) {
  const profilSnap = await getDoc(doc(db, 'users', user.uid));
  if (profilSnap.exists()) { window.location.href = './dashboard.html'; return; }
  if (!estPremiereConnexion) {
    afficherErreur("Aucun compte trouvé. Si c'est ta première connexion, utilise cet onglet.");
    await signOut(auth);
    return;
  }
  try {
    const invitation = await lireInvitationEnAttente(db, user);
    if (!invitation) throw new Error(
      "Aucune invitation en attente n'a été trouvée pour cet email. " +
      "Contacte l'administrateur de ton club pour en recevoir une."
    );
    if (invitation.role === 'player') {
      window.location.href = './choix-role.html';
      return;
    }
    await reclamerInvitation(db, user);
    window.location.href = './dashboard.html';
  } catch (e) {
    afficherErreur(e.message);
    await signOut(auth);
  }
}

document.getElementById('btn-connexion').addEventListener('click', async () => {
  const email = document.getElementById('c-email').value.trim();
  const mdp = document.getElementById('c-mdp').value;
  try {
    const { user } = await signInWithEmailAndPassword(auth, email, mdp);
    await apresConnexion(user, false);
  } catch (e) {
    afficherErreur("Connexion impossible : email ou mot de passe incorrect.");
  }
});

document.getElementById('btn-google-connexion').addEventListener('click', async () => {
  try {
    const { user } = await signInWithPopup(auth, googleProvider);
    await apresConnexion(user, true);
  } catch (e) { afficherErreur("Connexion Google impossible : " + e.message); }
});

document.getElementById('btn-inscription').addEventListener('click', async () => {
  const email = document.getElementById('i-email').value.trim();
  const mdp = document.getElementById('i-mdp').value;
  if (mdp.length < 6) { afficherErreur('Le mot de passe doit faire au moins 6 caractères.'); return; }
  try {
    const { user } = await createUserWithEmailAndPassword(auth, email, mdp);
    await apresConnexion(user, true);
  } catch (e) {
    if (e.code === 'auth/email-already-in-use') afficherErreur('Un compte existe déjà — utilise plutôt "Se connecter".');
    else afficherErreur("Inscription impossible : " + e.message);
  }
});

document.getElementById('btn-google-inscription').addEventListener('click', async () => {
  try {
    const { user } = await signInWithPopup(auth, googleProvider);
    await apresConnexion(user, true);
  } catch (e) { afficherErreur("Inscription Google impossible : " + e.message); }
});
</script>
</body>
</html>
