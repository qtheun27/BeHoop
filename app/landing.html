<body class="landing">
  <!-- Écran d'ouverture de l'appli (même animation, version nuit comme l'accroche) : retiré par lib/splash.ts quand la page
       et ses données sont prêtes, à la fin d'un tour d'animation. L'accroche démarre ses animations ensuite. -->
  <script>document.documentElement.classList.add('booting');</script>
  <div class="bh-splash" id="bh-splash" role="status" aria-label="Chargement">
    <svg class="cc-anim" width="150" height="150" viewBox="0 0 140 140" aria-hidden="true">
      <line class="cc-l" x1="0" y1="70" x2="140" y2="70" /><circle class="cc-o" cx="70" cy="70" r="48" /><circle class="cc-n" cx="70" cy="70" r="20" />
      <g class="cc-logo"><circle cx="70" cy="70" r="40" class="cc-disc" /><image href="/icons/emblem-dark.png" x="38" y="38" width="64" height="64" /></g>
    </svg>
    <div class="bh-wm"><span>Be</span><b>Hoop</b></div>
  </div>
  <style>.booting #root{visibility:hidden}.bh-splash{z-index:1000;background:radial-gradient(120% 90% at 85% 10%,#f26a1b47,#0000 55%),linear-gradient(160deg,#0a0c12 0%,#121a2b 60%,#0a0c12 100%);font-family:Sora,Avenir Next,sans-serif;transition:opacity .45s;position:fixed;inset:0}.bh-splash .cc-anim{margin:-95px 0 0 -75px;position:absolute;top:50%;left:50%;overflow:visible}.bh-splash .bh-wm{text-align:center;white-space:nowrap;letter-spacing:-.035em;height:26px;margin-top:69px;font-size:22px;line-height:26px;position:absolute;top:50%;left:0;right:0}.bh-wm span{color:#fff;font-weight:300}.bh-wm b{color:#f26a1b;font-weight:700}.cc-anim .cc-l,.cc-anim .cc-o,.cc-anim .cc-n{fill:none;stroke-linecap:round}.cc-anim .cc-o{stroke:#f26a1b;stroke-width:3px;stroke-dasharray:302;--l:302;animation:2.8s cubic-bezier(.6,0,.2,1) infinite cc-draw}.cc-anim .cc-n{stroke:#fff;stroke-width:2px;stroke-dasharray:126;--l:126;animation:2.8s cubic-bezier(.6,0,.2,1) .2s infinite cc-draw}.cc-anim .cc-l{stroke:#fff;stroke-width:2px;stroke-dasharray:140;--l:140;animation:2.8s cubic-bezier(.6,0,.2,1) .1s infinite cc-draw}.cc-anim .cc-disc{fill:#0a0c12}.cc-anim .cc-logo{transform-box:view-box;transform-origin:70px 70px;animation:2.8s infinite cc-pop}@keyframes cc-draw{0%{stroke-dashoffset:var(--l);opacity:1}38%{stroke-dashoffset:0;opacity:1}52%,86%{stroke-dashoffset:0;opacity:.35}to{stroke-dashoffset:0;opacity:0}}@keyframes cc-pop{0%,36%{opacity:0;transform:scale(0)rotate(-90deg)}50%{opacity:1;transform:scale(1.1)rotate(6deg)}58%,86%{opacity:1;transform:scale(1)rotate(0)}to{opacity:0;transform:scale(.92)}}@media (prefers-reduced-motion:reduce){.cc-anim *{animation:none!important}}</style>
  <div id="root"></div>
</body>
