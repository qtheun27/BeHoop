<body>
  <!-- Écran d'ouverture : affiché tout de suite, retiré par lib/splash.ts quand l'appli et ses données sont prêtes, à la fin d'un tour d'animation (même animation que <Loader full />, voir ui/HoopLoader.tsx, CenterSvg) -->
  <!-- Appli installée (iPhone) : au démarrage, iOS recalcule la hauteur de la page (zones sûres) et un centrage à 50 %
       se déplace. On centre donc sur la hauteur réelle de l'écran, qui ne change pas (même valeur pour <Loader full />). -->
  <script>
    // Tant que l'écran d'ouverture est là, l'appli reste invisible (elle se prépare dessous) : sur iPhone, ses éléments
    // flous (barre d'onglets…) passaient parfois un instant par-dessus l'animation. Retiré par lib/splash.ts au fondu.
    document.documentElement.classList.add('booting');
    (function () {
      var sa = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
      if (!sa || !screen.height) return;
      function set() {
        var land = innerWidth > innerHeight, h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        document.documentElement.style.setProperty('--splash-y', Math.round(h / 2) + 'px');
      }
      set(); addEventListener('orientationchange', function () { setTimeout(set, 300); });
    })();
  </script>
  <div class="bh-splash" id="bh-splash" role="status" aria-label="Chargement">
    <svg class="cc-anim" width="150" height="150" viewBox="0 0 140 140" aria-hidden="true">
      <line class="cc-l" x1="0" y1="70" x2="140" y2="70" /><circle class="cc-o" cx="70" cy="70" r="48" /><circle class="cc-n" cx="70" cy="70" r="20" />
      <g class="cc-logo"><circle cx="70" cy="70" r="40" class="cc-disc" /><image class="em-l" href="/icons/emblem-light.png" x="38" y="38" width="64" height="64" /><image class="em-d" href="/icons/emblem-dark.png" x="38" y="38" width="64" height="64" /></g>
    </svg>
    <div class="bh-wm"><span>Be</span><b>Hoop</b></div>
  </div>
  <div id="root"></div>
  <style>.booting #root{visibility:hidden}.bh-splash{z-index:1000;background:#f4f1ec;font-family:Sora,Avenir Next,sans-serif;transition:opacity .35s;position:fixed;inset:0}.bh-splash .cc-anim{left:50%;top:var(--splash-y,50%);margin:-95px 0 0 -75px;position:absolute}.bh-splash .bh-wm{left:0;right:0;top:var(--splash-y,50%);text-align:center;white-space:nowrap;height:26px;margin-top:69px;line-height:26px;position:absolute}.bh-wm{letter-spacing:-.035em;font-size:22px}.bh-wm span{color:#0d2a5c;font-weight:300}.bh-wm b{color:#f26a1b;font-weight:700}@media (prefers-color-scheme:dark){.bh-splash{background:#070b14}.bh-wm span{color:#fff!important}}.cc-anim{overflow:visible}.cc-anim .cc-l,.cc-anim .cc-o,.cc-anim .cc-n{fill:none;stroke-linecap:round}.cc-anim .cc-o{stroke:#f26a1b;stroke-width:3px;stroke-dasharray:302;--l:302;animation:2.8s cubic-bezier(.6,0,.2,1) infinite cc-draw}.cc-anim .cc-n{stroke:#0d2a5c;stroke-width:2px;stroke-dasharray:126;--l:126;animation:2.8s cubic-bezier(.6,0,.2,1) .2s infinite cc-draw}.cc-anim .cc-l{stroke:#0d2a5c;stroke-width:2px;stroke-dasharray:140;--l:140;animation:2.8s cubic-bezier(.6,0,.2,1) .1s infinite cc-draw}.cc-anim .cc-disc{fill:#f4f1ec}.cc-anim .cc-logo{transform-box:view-box;transform-origin:70px 70px;animation:2.8s infinite cc-pop}.cc-anim .em-d,.ball-anim .em-d{display:none}@keyframes cc-draw{0%{stroke-dashoffset:var(--l);opacity:1}38%{stroke-dashoffset:0;opacity:1}52%,86%{stroke-dashoffset:0;opacity:.35}to{stroke-dashoffset:0;opacity:0}}@keyframes cc-pop{0%,36%{opacity:0;transform:scale(0)rotate(-90deg)}50%{opacity:1;transform:scale(1.1)rotate(6deg)}58%,86%{opacity:1;transform:scale(1)rotate(0)}to{opacity:0;transform:scale(.92)}}@media (prefers-color-scheme:dark){.cc-anim .cc-n,.cc-anim .cc-l{stroke:#fff}.cc-anim .cc-disc{fill:#070b14}.cc-anim .em-l{display:none}.cc-anim .em-d{display:inline}}@media (prefers-reduced-motion:reduce){.cc-anim *{animation:none!important}}</style>
